<style>

// ============================== RNG ==============================
function mulberry32(seed) {
  let s = seed >>> 0;
  const f = function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  f.getState = () => s;          // stan jest całą pamięcią generatora: zapis gry bierze go stąd
  f.setState = v => { s = v >>> 0; };
  return f;
}
let rng = mulberry32(1);

const MAP_LIST = () => [{ id: 'prairie', name: 'Preria', size: 40, desc: 'Otwarte pole, rzeka przy krawędzi, jedna szeroka droga. Mapa klasyczna.', p: [33, 33], e: [2, 2] }].concat(Object.values(window.MAPS_DATA || {}));
const mapDef = id => MAP_LIST().find(m => m.id === id) || MAP_LIST()[0];
const TERRAIN_OF = { '#': T_CLIFF, '~': T_WATER, F: T_FOREST, T: T_THICK, G: T_GOLD };
function genLayoutMap(def) {
  const herds = [];
  def.rows.forEach((row, y) => { for (let x = 0; x < row.length; x++) {
    const c = row[x], t = TERRAIN_OF[c];
    if (t !== undefined) { S.terrain[idx(x, y)] = t; S.amt[idx(x, y)] = t === T_FOREST ? 100 : t === T_GOLD ? 1000 : 0; }
    else if (c === 'h' || c === 'b' || c === 'c') herds.push([x, y, c]);
  } });

  // (bez tego wyczerpany las w okolicy zostawia robotnika bezczynnym na zawsze)
  let node = findNodeNear(ter, Math.floor(u.x), Math.floor(u.y), 12);
  if (!node) node = findNodeNear(ter, Math.floor(u.x), Math.floor(u.y), 25);
  if (!node) node = findNodeNear(ter, Math.floor(u.x), Math.floor(u.y), MAP);
  if (node) orderGather(u, node[0], node[1]);
}
// zwolnienie farmy zajętej przez robotnika (przy zmianie rozkazu)
function releaseFarm(u) {
  for (const b of S.buildings) if (b.busy === u.id) b.busy = null;
  u.farm = null;
}
function orderGather(u, nx, ny) {
  u.node = [nx, ny];
  const gt = S.terrain[idx(nx, ny)];
  const ct = gt === T_FOREST ? 'wood' : gt === T_MEAT ? 'food' : 'gold';
  // zmiana surowca porzuca niesiony ładunek: inaczej drewno zamieniłoby się w złoto przy wpłacie
  if (u.carry > 0 && u.carryType !== ct) u.carry = 0;
  u.carryType = ct;
  releaseFarm(u); u.buildTarget = null; u.attackTarget = null; u.orderBuilding = null;
  u.path = uPath(u, nx, ny); u.pathI = 0;
  u.state = u.path.length ? 'toNode' : 'gather';
}

// ============================== ROZKAZY (kolejka z wejścia) ==============================
function queueCmd(cmd) { S.pending.push(cmd); }
function addHitFx(x, y, o) {
  S.hits.push(Object.assign({ x, y, age: 0 }, o));
  if (S.hits.length > 60) S.hits.shift();
}
function addShot(u, tx, ty) {
  S.shots.push({ x0: u.x, y0: u.y, x1: tx, y1: ty, age: 0 });
  if (S.shots.length > 40) S.shots.shift();
  sfx('shot', u.x, u.y);
}
function processCmds() {
  while (S.pending.length) {
    const c = S.pending.shift();
    if (c.action === 'order') executeOrder(c);
    else if (c.action === 'place') tryPlace(c.type, c.x, c.y);
    else if (c.action === 'train') tryTrain(c.building, c.unitType);
    else if (c.action === 'research') tryResearch(c.building, c.techId);
    else if (c.action === 'toggle') { c.building.on = !c.building.on; }
    else if (c.action === 'cancel') cancelQueueSlot(c.building, c.index);
    else if (c.action === 'rally') { if (S.buildings.includes(c.building) && inMap(c.x, c.y)) c.building.rally = [c.x, c.y]; }
    else if (c.action === 'stop') stopUnits(c.units);
    else if (c.action === 'attackmove') executeAttackMove(c);
    else if (c.action === 'patrol') executePatrol(c);
    else if (c.action === 'pack') startPack(c.building);
    else if (c.action === 'unpack') startUnpack(c.unit, c.x, c.y);
    else if (c.action === 'resume') {
      if (!S.buildings.includes(c.building)) continue;
      const idle = S.units.filter(u => u.fac === 'player' && unitRole(u, 'builder') && u.state === 'idle');
      if (idle.length) assignBuilders(c.building, idle);
      else uiAlert('Brak bezczynnych robotników (PPM: wybrane robotnicy wznowią)');
    }
  }
}
// stop: jednostka porzuca wszystko, co robiła (nawet pracę), i czeka na rozkaz
function stopUnits(list) {
  for (const u of list) {
    if (!S.units.includes(u) || u.state === 'flee') continue;
    releaseFarm(u);
    u.state = 'idle'; u.path = []; u.attackTarget = null; u.ordered = false; u.orderBuilding = null; u.node = null;
    u.buildTarget = null; u.captureTarget = null; u.waypoints = null; u.amTarget = null; u.patrol = null; u.unpackAt = null;
  }
}
// atak-ruch: marsz do punktu z walką po drodze; po zabiciu celu marsz trwa (resumeAfterInterrupt)
function executeAttackMove(c) {
  const units = c.units.filter(u => S.units.includes(u) && u.state !== 'flee');
  executeOrder({ units, x: c.x, y: c.y, targetUnit: null, targetHorse: null });
  for (const u of units) if (u.state === 'move' && CFG.units[u.type].aggro > 0) u.amTarget = [c.x, c.y];
}
// pakowanie tepee [P liczby]: budynek stoi do końca odliczania (pop liczy się do tego czasu), potem znika, a w jego miejscu pojawia się travois z jego HP; drugie polecenie przerywa
function startPack(b) {
  if (!S.buildings.includes(b) || !b.built || !CFG.buildings[b.type].packable) return;
  b.packing = b.packing ? null : { t: CFG.packTime };
}
function finishPack(b) {
  const spot = spawnSpotNear(b, CFG.units.travois);
  if (!spot) { b.packing = null; if (b.fac === 'player') uiAlert('Brak miejsca przy tepee: nie da się go spakować'); return; }
  // usunięcie bez destroyBuilding: bez wybuchu i bez warunków końca gry
  S.buildings = S.buildings.filter(x => x !== b);
  for (const u of S.units) {
    if (u.farm === b) { u.farm = null; u.state = 'idle'; }
    if (u.buildTarget === b) { u.buildTarget = null; u.state = 'idle'; }
    if (u.orderBuilding === b) { u.orderBuilding = null; u.state = 'idle'; }
  }
  const u = addUnit('travois', b.fac, spot[0] + 0.5, spot[1] + 0.5);
  u.hp = b.hp; u.maxHp = b.maxHp; u.packed = { type: b.type, hp: b.hp, maxHp: b.maxHp };
  if (S.selected.building === b) { S.selected.building = null; S.selected.units = [u]; }
  if (b.fac === 'player') { sfx('ok'); updatePanels(); }
}
// pole zabudowy wolne (bez kosztu): jak w tryPlace, ale z listy budynków już zapłaconych
function footprintFree(def, tx, ty, needExplored) {
  for (let y = ty; y < ty + def.h; y++) for (let x = tx; x < tx + def.w; x++)
    if (!inMap(x, y) || isBlocked(x, y) || (needExplored && !S.explored[idx(x, y)])) return false;
  return true;
}
function startUnpack(u, tx, ty) {
  if (!S.units.includes(u) || !u.packed || u.state === 'flee') return;
  const def = CFG.buildings[u.packed.type];
  if (!footprintFree(def, tx, ty, u.fac === 'player')) { if (u.fac === 'player') uiAlert('Nie można tu rozłożyć'); return; }
  u.node = null; releaseFarm(u); u.buildTarget = null; u.attackTarget = null; u.orderBuilding = null; u.waypoints = null; u.amTarget = null; u.patrol = null;
  u.unpackAt = [tx, ty]; u.path = uPath(u, tx, ty); u.pathI = 0; u.state = 'toUnpack';
}
function finishUnpack(u) {
  const [tx, ty] = u.unpackAt, pk = u.packed, def = CFG.buildings[pk.type];
  if (!footprintFree(def, tx, ty, false)) { u.state = 'idle'; u.unpackAt = null; if (u.fac === 'player') uiAlert('Miejsce zajęte: nie można rozłożyć'); return; }
  S.units = S.units.filter(x => x !== u);
  const wasSel = S.selected.units.includes(u);
  S.selected.units = S.selected.units.filter(x => x !== u);
  for (const g in S.groups) S.groups[g] = S.groups[g].filter(x => x !== u);
  const b = addBuilding(pk.type, tx, ty, u.fac);
  b.built = true; b.progress = 1; b.hp = pk.hp; b.maxHp = pk.maxHp;
  ejectUnitsFrom(b);
  if (wasSel) S.selected.building = b;
  if (u.fac === 'player') { sfx('place', b.cx, b.cy); updatePanels(); }
}
// patrol A<->B: marsz jak atak-ruch (walka po drodze, powrót na trasę po walce), na końcu odcinka jednostka zawraca; A to miejsce wydania rozkazu
function executePatrol(c) {
  const units = c.units.filter(u => S.units.includes(u) && u.state !== 'flee' && CFG.units[u.type].aggro > 0);
  const from = units.map(u => [Math.floor(u.x), Math.floor(u.y)]);
  executeOrder({ units, x: c.x, y: c.y, targetUnit: null, targetHorse: null });
  units.forEach((u, i) => { if (u.state === 'move') { u.patrol = { pts: [from[i], [c.x, c.y]], i: 1 }; u.amTarget = [c.x, c.y]; } });
}
// anulowanie slotu kolejki: zapłacony koszt wraca
function cancelQueueSlot(b, i) {
  if (!S.buildings.includes(b) || !b.queue[i]) return;
  const q = b.queue.splice(i, 1)[0];
  if (q.paid) for (const k in CFG.units[q.type].cost) addRes(k, CFG.units[q.type].cost[k], b.fac);
}
function executeOrder(c) {
  const units = c.units.filter(u => S.units.includes(u) && u.state !== 'flee');
  if (!c.queue) for (const u of units) { u.waypoints = null; u.amTarget = null; u.patrol = null; u.unpackAt = null; }
  if (c.units.some(u => S.units.includes(u) && u.state === 'flee')) uiAlert('Spanikowana jednostka ignoruje rozkazy');
  if (!units.length) return;
  if (!c.silent) sfx('order', c.x, c.y);
  // cel: jednostka wroga?
  const target = c.targetUnit && S.units.includes(c.targetUnit) ? c.targetUnit : null;
  // polowanie: klik na zwierzę; jednostki z flagą hunter (worker, desperado-łowca) atakują, reszta tylko podchodzi
  if (target && target.fac === 'neutral' && CFG.units[target.type] && CFG.units[target.type].animal) {
    for (const u of units) {
      if (CFG.units[u.type] && CFG.units[u.type].hunter) {
        u.attackTarget = target; u.ordered = true; u.node = null; releaseFarm(u); u.buildTarget = null; u.orderBuilding = null;
        u.state = 'attack';
      } else {
        u.node = null; releaseFarm(u); u.buildTarget = null; u.attackTarget = null; u.orderBuilding = null;
        u.path = uPath(u, c.x, c.y); u.pathI = 0; u.state = 'move';
      }
    }
    return;
  }
  const b = buildingAt(c.x, c.y);
  if (target && target.fac !== units[0].fac) {
    for (const u of units) {
      u.attackTarget = target; u.ordered = true; u.node = null; releaseFarm(u); u.buildTarget = null;
      u.state = 'attack';
    }
    return;
  }
  // schwytanie dzikiego konia (dowolna jednostka, 5 s [Ź])
  if (c.targetHorse && S.units.includes(c.targetHorse)) {
    const h = c.targetHorse;
    if (facRes(units[0].fac).horses >= CFG.resCap.horses) { uiAlert('Zagroda pełna: limit koni ' + CFG.resCap.horses); return; }
    for (const u of units) {
      u.captureTarget = h; u.node = null; releaseFarm(u); u.buildTarget = null; u.attackTarget = null; u.orderBuilding = null;
      u.path = uPath(u, Math.floor(h.x), Math.floor(h.y)); u.pathI = 0;
      u.state = u.path.length ? 'toCapture' : 'capture';
    }
    return;
  }
  // budynek wroga albo własna farma
  if (b) {
    if (b.fac !== units[0].fac) {
      for (const u of units) { u.orderBuilding = b; u.attackTarget = null; releaseFarm(u); u.buildTarget = null; u.state = 'assault'; u.path = pathToBuildingU(u, b); u.pathI = 0; }
      return;
    }
    if (b.type === 'farm' && b.built) {
      const workers = units.filter(u => unitRole(u, 'farmer'));
      for (const u of workers) {
        if (b.busy && b.busy !== u.id) { uiAlert('Farma jest już zajęta'); continue; }
        releaseFarm(u);
        b.busy = u.id;
        u.farm = b; u.node = null; u.buildTarget = null; u.attackTarget = null;
        u.path = pathToBuildingU(u, b); u.pathI = 0;
        u.state = u.path.length ? 'toFarm' : 'farming';
      }
      const rest = units.filter(u => !unitRole(u, 'farmer'));
      for (const u of rest) { u.state = 'move'; u.path = uPath(u, c.x, c.y); u.pathI = 0; }
      return;
    }
    // nieukończona własna budowla: wznowienie budowy
    if (!b.built) {
      assignBuilders(b, units.filter(u => unitRole(u, 'builder')));
      for (const u of units.filter(u => !unitRole(u, 'builder'))) { u.state = 'move'; u.path = uPath(u, c.x, c.y); u.pathI = 0; }
      return;
    }
  }
  // surowiec?
  const ter = inMap(c.x, c.y) ? S.terrain[idx(c.x, c.y)] : T_GRASS;
  if ((ter === T_FOREST || ter === T_GOLD || ter === T_MEAT) && S.amt[idx(c.x, c.y)] > 0) {
    for (const u of units) {
      if (canGatherRes(u, ter)) orderGather(u, c.x, c.y);
      else { u.state = 'move'; u.path = uPath(u, c.x, c.y); u.pathI = 0; }
    }
    return;
  }
  // ruch; z Shiftem kolejne punkty tworzą trasę (waypointy), jeśli jednostka już idzie
  for (const u of units) {
    if (c.queue && u.state === 'move') { (u.waypoints = u.waypoints || []).push([c.x, c.y]); continue; }
    u.node = null; releaseFarm(u); u.buildTarget = null; u.attackTarget = null; u.orderBuilding = null;
    u.path = uPath(u, c.x, c.y); u.pathI = 0;
    u.state = 'move';
  }
}
// role zawodowe jednostek: builder (buduje), farmer (uprawia); zbieranie z mapy opisuje lista 'gather'
function unitRole(u, role) {
  const d = CFG.units[u.type];
  return !!(d && d[role]);
}
// kto może zbierać surowiec z mapy: lista 'gather' w danych jednostki (las, złoto, padlina). Robotnik wszystko, wojownik wszystko, squaw nic, frontierswoman drewno,
// frontiersman złoto i padlinę [Ź podział ról 6.2, przydział złota i padliny decyzja własna]
function canGatherRes(u, ter) {
  const d = CFG.units[u.type], g = d && d.gather;
  if (!g) return false;
  return (ter === T_FOREST && g.includes('forest')) || (ter === T_GOLD && g.includes('gold')) || (ter === T_MEAT && g.includes('meat'));
}
// przydziel robotników do budowy (nowej albo przerwanej)
function assignBuilders(b, workers) {
  for (const u of workers) {
    u.buildTarget = b; u.node = null; releaseFarm(u); u.attackTarget = null; u.orderBuilding = null;
    u.path = pathToBuildingU(u, b); u.pathI = 0;
    u.state = u.path.length ? 'toBuild' : 'building';
  }
}
function tryPlace(type, tx, ty) {
  const def = CFG.buildings[type];
  for (let y = ty; y < ty + def.h; y++) for (let x = tx; x < tx + def.w; x++)
    if (!inMap(x, y) || isBlocked(x, y)) { uiAlert('Nie można tu budować'); return; }
    else if (!S.explored[idx(x, y)]) { uiAlert('Nie można budować w nieodkrytym terenie'); return; }
  // limit zabudowy liczy się od STARTU budowy (budynki w trakcie budowy też): w oryginale sprawdzano go przy ukończeniu i dało się obejść [Ź 14.5]
  if (def.limit && S.buildings.filter(x => x.fac === 'player' && x.type === type).length >= def.limit) { uiAlert('Limit: maksymalnie ' + def.limit + ' (' + def.label.toLowerCase() + ')'); return; }
  if (!pay(def.cost)) { uiAlert('Brak surowców'); return; }
  const b = addBuilding(type, tx, ty, 'player');
  sfx('place', b.cx, b.cy);
  ejectUnitsFrom(b);
  assignBuilders(b, S.selected.units.filter(u => unitRole(u, 'builder')));
}
// jednostki stojące na planie nowego budynku wychodzą na najbliższe wolne pole przy jego krawędzi
function ejectUnitsFrom(b) {
  for (const u of S.units) {
    if (u.x < b.tx || u.x >= b.tx + b.w || u.y < b.ty || u.y >= b.ty + b.h) continue;
    const spot = spawnSpotNear(b, CFG.units[u.type]);
    if (!spot) continue;
    u.x = spot[0] + 0.5; u.y = spot[1] + 0.5; u.path = [];
    if (u.state === 'move') u.state = 'idle';
  }
}
function tryTrain(b, unitType) {
  if (!b.built || b.queue.length >= 5) return;
  const def = CFG.units[unitType];
  if (def.limit) {
    const cnt = S.units.filter(u => u.fac === b.fac && u.type === unitType).length + b.queue.filter(q => q.type === unitType).length;
    if (cnt >= def.limit) { uiAlert('Limit: maksymalnie ' + def.limit); return; }
  }
  if (popUsed(b.fac) + queuedCount(b.fac) >= popCap(b.fac)) { uiAlert('Brak miejsc (zbuduj dom)'); return; }
  if (!canAfford(def.cost, b.fac)) { uiAlert('Brak surowców'); return; }
  // koszt pobierany dopiero, gdy slot zaczyna pracę; do tego czasu brak surowców wstrzymuje slot (dok. 19.7)
  b.queue.push({ type: unitType, remaining: def.train, paid: false });
}
function tryResearch(b, techId) {
  const td = CFG.techs[techId];
  if (!td || td.bld !== b.type || !b.built || b.research || hasTech(b.fac, techId)) return;
  if (!pay(td.cost, b.fac)) { uiAlert('Brak surowców'); return; }
  b.research = { id: techId, remaining: td.time };
}

// ============================== UPDATE ==============================
function update(dt) {
  if (S.gameOver) return;
  if (S.menuOpen || S.paused) return; // menu startowe i pomoc w grze: symulacja stoi, kamera i render żyją
  S.time += dt;
  processCmds();
  S.fogET -= dt; if (S.fogET <= 0) { S.fogET = 0.25; computeFogEnemy(); }
  for (const u of S.units) updateUnit(u, dt);
  for (const b of S.buildings) updateBuilding(b, dt);
  updateAbilities(dt);
  // morale: aktualizacja w dyskretnych krokach co 1 s (formuły 19.4)
  S.moraleT += dt;
  while (S.moraleT >= CFG.morale.tick) { S.moraleT -= CFG.morale.tick; updateMorale(); }
  // rozsunięcie jednostek
  const us = S.units;
  for (let i = 0; i < us.length; i++) for (let j = i + 1; j < us.length; j++) {
    const a = us[i], b = us[j];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d2 = dx * dx + dy * dy;
    if (d2 > 0.0001 && d2 < 0.2) {
      const d = Math.sqrt(d2), push = (0.45 - d) * 0.5;
      const nx = dx / d, ny = dy / d;
      a.x -= nx * push * dt * 3; a.y -= ny * push * dt * 3;
      b.x += nx * push * dt * 3; b.y += ny * push * dt * 3;
    }
  }
  // klamp pozycji (separacja nie może wypchnąć poza mapę)
  for (const u of S.units) {
    u.x = Math.max(0.05, Math.min(MAP - 0.05, u.x));
    u.y = Math.max(0.05, Math.min(MAP - 0.05, u.y));
  }
  // AI bandytów: myśli zamiast sztucznych fal (gospodarka, trening, wyprawy łupieżcze)
  updateAI(dt);
  updateMission(dt);
  // kapitulacja gracza (reguła z patcha 1.02: brak obozu, przywódcy i robotników)
  const pUnits = S.units.filter(u => u.fac === 'player');
  if (missionRule('surrender', true) && !pUnits.some(u => u.type === 'worker') && pUnits.length === 0 && S.res.food < 30) endGame('lose', 'Twoja osada zniknęła z mapy. Dzikie czasy.');
  if (S.fx) { S.fx.age += dt; if (S.fx.age > 1) S.fx = null; }
  for (const sh of S.shots) sh.age += dt;
  S.shots = S.shots.filter(sh => sh.age < 0.25);
  for (const h of S.hits) h.age += dt;
  S.hits = S.hits.filter(h => h.age < 0.3);
  computeFog();
}

function stepSnd(u, dist) {
  // kroki liczone przebytym dystansem, nie czasem: jednostka stojąca nie hałasuje
  u.stepAcc = (u.stepAcc || 0) + dist;
  u.walkD = (u.walkD || 0) + dist;   // przebyty dystans: faza animacji chodu
  const hoof = u.type === 'jezdiec' || u.type === 'konnobanda';
  if (u.stepAcc >= (hoof ? 0.4 : 0.5)) { u.stepAcc = 0; sfx(hoof ? 'hoof' : 'step', u.x, u.y); }
}
function followPath(u, dt) {
  const def = CFG.units[u.type];
  const [nx, ny] = u.path[u.pathI];
  // przeszkoda (np. budynek) pojawiła się na trasie po jej wyznaczeniu: stań jak przy końcu ścieżki, stan jednostki sam wyznaczy nową
  if (!passableFor(def, nx, ny)) { u.path = []; return true; }
  const tx = nx + 0.5, ty = ny + 0.5;
  const dx = tx - u.x, dy = ty - u.y;
  const d = Math.hypot(dx, dy);
  if (d > 0.01) { u.fdx = dx; u.fdy = dy; }   // kierunek ruchu (rysowanie 8-kierunkowe)
  // koszt terenowy: rzeka 0.5 dla Indian, gęsty las 1.5/2.0, trawa 1.0 (tempo = speed / koszt)
  const step = def.speed * dt / terrainCost(def, Math.floor(u.x), Math.floor(u.y));
  if (d <= step) { u.x = tx; u.y = ty; stepSnd(u, Math.min(d, step)); u.pathI++; if (u.pathI >= u.path.length) { u.path = []; return true; } }
  else { u.x += dx / d * step; u.y += dy / d * step; if (Math.abs(dx) > 0.01) u.facing = dx > 0 ? 1 : -1; stepSnd(u, step); }
  return false;
}

// zasięg wręcz 1 to cios z sąsiedniego kafla, także po skosie: środki kafli dzieli tam 1.41, a cel stoi gdziekolwiek na swoim kaflu
function reachOf(def) { return def.range <= 1 ? 1.5 : def.range; }
// odległość punktu od prostokąta budynku (0 w środku)
function rectDist(x, y, b) {
  const dx = Math.max(b.tx - x, 0, x - (b.tx + b.w)), dy = Math.max(b.ty - y, 0, y - (b.ty + b.h));
  return Math.hypot(dx, dy);
}
// krok wprost do punktu; nie wchodzi na kafel, którego jednostka nie może zająć
function stepToward(u, tx, ty, dt) {
  const def = CFG.units[u.type];
  const dx = tx - u.x, dy = ty - u.y, d = Math.hypot(dx, dy);
  if (d < 0.001) return;
  const step = Math.min(d, def.speed * dt / terrainCost(def, Math.floor(u.x), Math.floor(u.y)));
  const nx = u.x + dx / d * step, ny = u.y + dy / d * step;
  u.fdx = dx; u.fdy = dy;
  if (!passableFor(def, Math.floor(nx), Math.floor(ny))) return;
  u.x = nx; u.y = ny;
  if (Math.abs(dx) > 0.01) u.facing = dx > 0 ? 1 : -1;
  stepSnd(u, step);
}

function updateUnit(u, dt) {
  // killUnit podmienia S.units, a pętla update dalej iteruje po starej tablicy: zabity w tym ticku nie może już działać
  if (u.dead) return;
  if (u.type === 'horse') { updateHorse(u, dt); return; }
  if (CFG.units[u.type] && CFG.units[u.type].animal) { updateAnimal(u, dt); return; }
  const def = CFG.units[u.type];
  u.cd = Math.max(0, u.cd - dt);
  u.kick = Math.max(0, (u.kick || 0) - dt);
  // wojsko: auto-nabór celu w promieniu agresji (neutralne konie nie są celem)
  const acqR = stanceAcquireR(u, def);
  if (acqR > 0 && !isSwimming(u) && !u.attackTarget && u.state !== 'assault' && u.state !== 'flee') {
    let best = null, bd = acqR * acqR;
    for (const e of S.units) {
      if (e.fac === u.fac || e.fac === 'neutral' || !seenBy(u.fac, e)) continue;   // atak zaczyna się tylko na cel widziany przez frakcję
      const d = (e.x - u.x) ** 2 + (e.y - u.y) ** 2;
      if (d < bd) { bd = d; best = e; }
    }
    if (best) { u.attackTarget = best; u.ordered = false; u.state = 'attack'; }
  }
  switch (u.state) {
    case 'flee': {
      u.fleeT -= dt;
      if (u.path.length) followPath(u, dt);
      if (u.fleeT <= 0) {
        // nadal złamany: kolejna odsłona ucieczki, aż morale odbuduje się nad próg
        if (u.morale < CFG.morale.fleeAt) { startFlee(u); break; }
        resumeAfterInterrupt(u);
      }
      break;
    }
    case 'toCapture': {
      const h = u.captureTarget;
      if (!h || !S.units.includes(h)) { u.state = 'idle'; u.captureTarget = null; break; }
      const d = Math.hypot(h.x - u.x, h.y - u.y);
      if (d <= 1.9) { u.state = 'capture'; u.captureT = 5; u.path = []; break; }
      if (!u.path.length || followPath(u, dt)) {
        u.path = uPath(u, Math.floor(h.x), Math.floor(h.y)); u.pathI = 0;
        u.state = u.path.length ? 'toCapture' : 'idle';
      }
      break;
    }
    case 'capture': {
      const h = u.captureTarget;
      if (!h || !S.units.includes(h)) { u.state = 'idle'; u.captureTarget = null; break; }
      const d = Math.hypot(h.x - u.x, h.y - u.y);
      if (d > 2.2) { u.state = 'toCapture'; u.path = uPath(u, Math.floor(h.x), Math.floor(h.y)); u.pathI = 0; break; }
      u.captureT -= dt;
      if (u.captureT <= 0) {
        // limit koni mógł się zapełnić w trakcie chwytania: koń zostaje na mapie zamiast przepaść
        if (facRes(u.fac).horses >= CFG.resCap.horses) {
          u.captureTarget = null; u.state = 'idle';
          if (u.fac === 'player') uiAlert('Zagroda pełna: limit koni ' + CFG.resCap.horses);
          break;
        }
        removeHorse(h);
        addRes('horses', 1, u.fac);
        u.captureTarget = null; u.state = 'idle';
        if (u.fac === 'player') { uiAlert('Schwycono konia (w zagrodzie: ' + Math.floor(S.res.horses) + ')'); sfx('ok'); }
      }
      break;
    }
    case 'toUnpack': {
      const pd = CFG.buildings[u.packed.type], [ux, uy] = u.unpackAt, near = () => Math.hypot(ux + pd.w / 2 - u.x, uy + pd.h / 2 - u.y) <= 2.3;   // BFS staje w promieniu 1 kafla od celu
      if (near()) { u.state = 'unpacking'; u.unpackT = CFG.packTime; u.path = []; break; }
      if (!u.path.length || followPath(u, dt)) {
        if (near()) { u.state = 'unpacking'; u.unpackT = CFG.packTime; u.path = []; }
        else { u.state = 'idle'; u.unpackAt = null; if (u.fac === 'player') uiAlert('Nie można dojechać na wskazane miejsce'); }
      }
      break;
    }
    case 'unpacking': u.unpackT -= dt; if (u.unpackT <= 0) finishUnpack(u); break;
    case 'idle': break;
    case 'move':
      if (!u.path.length || followPath(u, dt)) {
        const nw = u.waypoints && u.waypoints.shift();
        if (nw) { u.path = uPath(u, nw[0], nw[1]); u.pathI = 0; if (!u.path.length) u.state = 'idle'; }
        else if (u.patrol) {
          u.patrol.i ^= 1; const dest = u.patrol.pts[u.patrol.i];
          u.path = uPath(u, dest[0], dest[1]); u.pathI = 0; u.amTarget = dest;
          if (!u.path.length) { u.patrol = null; u.amTarget = null; u.state = 'idle'; }
        }
        else { u.state = 'idle'; u.amTarget = null; }
      }
      break;
    case 'toNode': if (!u.path.length || followPath(u, dt)) u.state = 'gather'; break;
    case 'toDeposit': if (!u.path.length || followPath(u, dt)) u.state = 'deposit'; break;
    case 'toBuild': if (!u.path.length || followPath(u, dt)) u.state = 'building'; break;
    case 'toFarm': if (!u.path.length || followPath(u, dt)) u.state = 'farming'; break;
    case 'gather': {
      if (!u.node || !inMap(u.node[0], u.node[1]) || S.amt[idx(u.node[0], u.node[1])] <= 0) { switchToDeposit(u); break; }
      const nd = Math.hypot(u.node[0] + 0.5 - u.x, u.node[1] + 0.5 - u.y);
      if (nd > 2.2) {
        u.path = uPath(u, u.node[0], u.node[1]); u.pathI = 0;
        u.state = u.path.length ? 'toNode' : 'idle';
        break;
      }
      const rate = gatherRate(u);
      // XP z czasu pracy (Gameswelt), narasta nawet gdy surowiec się kończy, dopóki robotnik pracuje
      gainXp(u, CFG.work.xpRate * dt);
      const take = Math.min(rate * dt, CFG.carry - u.carry, S.amt[idx(u.node[0], u.node[1])]);
      u.carry += take;
      // rytm pracy: stuk siekiery/kilufa co ~0.8-1.1 s, rozsynchronizowany per robotnik (u.id)
      u.sndT = (u.sndT || 0) + dt;
      if (u.sndT >= 0.8 + (u.id % 4) * 0.1) { u.sndT = 0; sfx(u.carryType === 'wood' ? 'chop' : 'mine', u.x, u.y, 0.3); }
      S.amt[idx(u.node[0], u.node[1])] -= take;
      if (S.amt[idx(u.node[0], u.node[1])] <= 0) { S.terrain[idx(u.node[0], u.node[1])] = T_GRASS; }
      if (u.carry >= CFG.carry) switchToDeposit(u);
      break;
    }
    case 'deposit': {
      const d = nearestDeposit(u);
      if (d) { addRes(u.carryType, u.carry, u.fac); }
      u.carry = 0;
      if (u.node && inMap(u.node[0], u.node[1]) && S.amt[idx(u.node[0], u.node[1])] > 0) {
        u.path = uPath(u, u.node[0], u.node[1]); u.pathI = 0; u.state = u.path.length ? 'toNode' : 'gather';
      } else {
        const next = findNodeNear(u.carryType === 'wood' ? T_FOREST : u.carryType === 'food' ? T_MEAT : T_GOLD, Math.floor(u.x), Math.floor(u.y), 12);
        if (next) orderGather(u, next[0], next[1]); else u.state = 'idle';
      }
      break;
    }
    case 'building': {
      const b = u.buildTarget;
      if (!b || !S.buildings.includes(b)) { u.state = 'idle'; break; }
      if (b.built) { u.state = 'idle'; u.buildTarget = null; break; }
      const bdist = Math.hypot(b.cx - u.x, b.cy - u.y);
      if (bdist > (b.w + b.h) / 2 + 1.5) {
        u.path = pathToBuildingU(u, b); u.pathI = 0;
        u.state = u.path.length ? 'toBuild' : 'idle';
        break;
      }
      // postęp liczy updateBuilding (zależnie od liczby budujących)
      // rytm budowy: stuk młotka co ~0.9-1.1 s, rozsynchronizowany per robotnik
      u.sndT = (u.sndT || 0) + dt;
      if (u.sndT >= 0.9 + (u.id % 3) * 0.1) { u.sndT = 0; sfx('build', u.x, u.y, 0.3); }
      break;
    }
    case 'farming': {
      const f = u.farm;
      if (!f || !S.buildings.includes(f) || !f.built) { u.state = 'idle'; if (f) f.busy = null; break; }
      const fdist = Math.hypot(f.cx - u.x, f.cy - u.y);
      if (fdist > 2.5) {
        u.path = pathToBuildingU(u, f); u.pathI = 0;
        if (u.path.length) u.state = 'toFarm'; else { f.busy = null; u.state = 'idle'; }
        break;
      }
      const fd = CFG.buildings.farm;
      const prod = farmRate(u) * dt;
      const upkeep = prod * fd.upkeep;
      const R = facRes(u.fac);
      if (R.wood >= upkeep) {
        R.wood -= upkeep;
        addRes('food', prod, u.fac);
        gainXp(u, CFG.work.xpRate * dt);
        if (u.fac === 'player') S.woodAlertT = 0;
      } else if (u.fac === 'player') {
        S.woodAlertT += dt;
        if (S.woodAlertT > 10) { uiAlert('Brak drewna! Farma stoi (upkeep)'); S.woodAlertT = 0; }
      }
      break;
    }
    case 'attack': {
      const t = u.attackTarget;
      if (!t || !S.units.includes(t)) { resumeAfterInterrupt(u); break; }
      const d = Math.hypot(t.x - u.x, t.y - u.y);
      // postawa decyduje o pościgu: cel z rozkazu goni zawsze, automatyczny słucha postawy
      if (stanceDropsTarget(u, def, d, !!u.ordered)) { resumeAfterInterrupt(u); break; }
      if (d > reachOf(def)) {
        u.repathT -= dt;
        if (u.repathT <= 0) { u.path = uPath(u, Math.floor(t.x), Math.floor(t.y)); u.pathI = 0; u.repathT = 0.8; u.state = 'attack'; }
        // pusta ścieżka przy celu poza zasięgiem = BFS uznał jednostkę za "na miejscu" (promień stopu 1 kafla), więc dochodzimy wprost
        if (u.path.length) followPath(u, dt); else stepToward(u, t.x, t.y, dt);
      } else if (u.cd <= 0 && !isSwimming(u)) {
        u.cd = def.cd;
        u.kick = 0.15;
        if (t.fac === 'player' && u.fac === 'enemy') notifyAttack(t.x, t.y, u.x, u.y);
        if (def.range > 1) addShot(u, t.x, t.y); else sfx('melee', t.x, t.y);
        const tdef = CFG.units[t.type];
        // strzał płoszy zwierzynę w promieniu 5 od celu [Ź 19.6], cios wręcz tylko trafione zwierzę
        if (def.range > 1) scareAnimals(t.x, t.y, 5); else if (tdef && tdef.animal) scareAnimal(t, u.x, u.y);
        if (rngCombat() < hitChance(u.lvl, t.lvl, flankBonus(t))) {
          addHitFx(t.x, t.y, { melee: def.range <= 1 });
          t.hp -= rollDamage(def.dmg, u.lvl, typeMult(def, tdef, false), 0);
          t.morale = Math.max(0, t.morale - CFG.morale.hitPenalty);
          t.lastThreat = u;
          gainXp(u, CFG.xp.hit);
          if (def.splash) applySplash(u, t, def);
          if (t.hp <= 0) { gainXp(u, CFG.xp.kill); killUnit(t); }
          else if (tdef && tdef.fleesOnHit && t.state !== 'flee') startFlee(t); // squaw nie walczy, ucieka
        } else {
          addHitFx(t.x, t.y, { miss: true });
        }
      }
      break;
    }
    case 'assault': {
      const b = u.orderBuilding;
      if (!b || !S.buildings.includes(b)) { u.orderBuilding = null; u.state = 'idle'; break; }
      // w pobliżu wroge jednostki? zaatakuj (postawa bramkuje: trzymaj pozycję ignoruje prowokacje)
      if (stanceAcquireR(u, def) > 0 && !isSwimming(u)) {
        for (const e of S.units) {
          if (e.fac === u.fac || e.fac === 'neutral' || !seenBy(u.fac, e)) continue;
          const d = (e.x - u.x) ** 2 + (e.y - u.y) ** 2;
          if (d < def.aggro * def.aggro * 0.25) { u.attackTarget = e; u.ordered = false; u.state = 'attack'; return; }
        }
      }
      // dystans do obrysu budynku, nie do środka: w rogu pierścienia dojścia środek jest dalej niż zasięg wręcz + promień
      if (rectDist(u.x, u.y, b) > Math.max(def.range, 1)) {
        u.repathT -= dt;
        if (u.repathT <= 0) { u.path = pathToBuildingU(u, b); u.pathI = 0; u.repathT = 1.5; }
        // ponowne wyznaczenie w połowie kafla widzi jednostkę "już w celu" i daje pustą ścieżkę: dochodzimy wprost do obrysu
        if (u.path.length) followPath(u, dt); else stepToward(u, b.cx, b.cy, dt);
      } else if (u.cd <= 0 && !isSwimming(u)) {
        u.cd = def.cd;
        u.kick = 0.15;
        if (b.fac === 'player' && u.fac === 'enemy') notifyAttack(b.cx, b.cy, u.x, u.y);
        if (def.range > 1) addShot(u, b.cx, b.cy);
        addHitFx(b.cx, b.cy, { melee: def.range <= 1 });
        b.hp -= rollDamage(def.dmg, u.lvl, typeMult(def, null, true), 0);
        if (b.hp <= 0) {
          // łupy: część mienia zniszczonego obozu trafia do magazynów napastnika [Ź: klimat łupieżczy]
          addRes('wood', 25, u.fac); addRes('food', 25, u.fac); addRes('gold', 8, u.fac);
          destroyBuilding(b);
        }
      }
      break;
    }
  }
}
// obrażenia obszarowe armaty [P: połowa obrażeń, bez rzutu na trafienie, bez friendly fire]; cel główny rozlicza wywołujący
function applySplash(att, t, def) {
  const R2 = def.splash * def.splash;
  for (const e of S.units.slice()) {
    if (e === t || e.dead || e.fac === att.fac || e.fac === 'neutral') continue;
    if ((e.x - t.x) ** 2 + (e.y - t.y) ** 2 > R2) continue;
    const edef = CFG.units[e.type];
    if (edef && edef.animal) continue;
    e.hp -= rollDamage(def.dmg * 0.5, att.lvl, typeMult(def, edef, false), 0);
    e.morale = Math.max(0, e.morale - CFG.morale.hitPenalty);
    e.lastThreat = att;
    if (e.hp <= 0) { gainXp(att, CFG.xp.kill); killUnit(e); }
  }
}
// po przerwaniu (walka, panika) jednostka wraca do tego, co robiła: szturm, zbiór, farma, budowa; inaczej stoi bezczynnie
function resumeAfterInterrupt(u) {
  u.attackTarget = null;
  if (u.orderBuilding && S.buildings.includes(u.orderBuilding)) { u.state = 'assault'; return; }
  if (u.node && inMap(u.node[0], u.node[1]) && S.amt[idx(u.node[0], u.node[1])] > 0) {
    u.path = uPath(u, u.node[0], u.node[1]); u.pathI = 0;
    u.state = u.path.length ? 'toNode' : 'gather';
    return;
  }
  const f = u.resumeFarm; u.resumeFarm = null;
  if (f && S.buildings.includes(f) && f.built && !f.busy) {
    f.busy = u.id; u.farm = f; u.path = pathToBuildingU(u, f); u.pathI = 0;
    u.state = u.path.length ? 'toFarm' : 'farming';
    return;
  }
  const bt = u.resumeBuild; u.resumeBuild = null;
  if (bt && S.buildings.includes(bt) && !bt.built) { assignBuilders(bt, [u]); return; }
  if (u.amTarget) {
    u.path = uPath(u, u.amTarget[0], u.amTarget[1]); u.pathI = 0;
    if (u.path.length) { u.state = 'move'; return; }
    u.amTarget = null;
  }
  u.state = 'idle';
}
function switchToDeposit(u) {
  const d = nearestDeposit(u);
  if (!d) { u.state = 'idle'; return; }
  u.path = pathToBuildingU(u, d); u.pathI = 0;
  u.state = u.path.length ? 'toDeposit' : 'deposit';
}

// ============================== MODEL WALKI (formuły 19.4) ==============================
// trafienie: clamp(0.75 + 0.05*(poziomA - poziomT) + 0.10*oskrzydlenie, 0.30, 0.95)
function hitChance(lvlA, lvlT, flank) {
  return Math.max(0.30, Math.min(0.95, 0.75 + 0.05 * (lvlA - lvlT) + 0.10 * flank));
}
// mnożniki typu z 19.4: wręcz x1.5 przeciw strzeleckim, kawaleria x1.5 przeciw artylerii,
// artyleria x0.5 przeciw pojedynczym pieszym, x2.0 przeciw budynkom (artyleria czeka na wdrożenie)
function typeMult(attackerDef, targetDef, targetIsBuilding) {
  const a = attackerDef.kind || 'melee';
  if (targetIsBuilding) return a === 'art' ? 2.0 : 1.0;
  const t = targetDef.kind || 'melee';
  if (t === 'art') return attackerDef.cav ? 1.5 : 1.0;
  if (t === 'gun' && a === 'melee') return 1.5;
  if (t === 'bow' && a === 'melee') return 1.5; // łuk to broń dystansowa, bonus wręcz działa jak przeciw broni palnej (decyzja własna, źródła milczą)
  if (a === 'art') return 0.5;
  return 1.0;
}
// obrażenia: max(1, baza * (1 + 0.10*poziom) * mnożnikTypu - pancerz(cel))
// pancerz w prototypie na razie 0 dla wszystkich (brak wartości w źródłach, czeka na manual)
function rollDamage(base, lvl, mult, armor) {
  return Math.max(1, Math.round(base * (1 + 0.10 * lvl) * mult - armor));
}
// poziom z XP (progi 25/75/150 -> poziomy 0-3); progi i zdobycz XP to decyzja projektowa,
// oryginał ma trzecią statystykę doświadczenia ale nie znamy jego tabel
function xpLevel(xp) {
  const th = CFG.xp.thresholds; let lvl = 0;
  for (let i = 0; i < th.length; i++) if (xp >= th[i]) lvl = i + 1;
  return lvl;
}
function gainXp(u, n) {
  u.xp += n;
  const nl = xpLevel(u.xp);
  if (nl > u.lvl) { u.lvl = nl; addHitFx(u.x, u.y, { lvlUp: true }); if (u.fac === 'player') sfx('ok', u.x, u.y); }
}
// Gameswelt: doświadczenie rośnie z czasem każdej pracy (nie tylko walki), a morale wpływa na pracowitość.
// Mnożnik tempa pracy liniowy od morale: 100 daje 1.0, 0 daje moraleMin. Wartości własne, źródła nie podają tabel.
function workMult(u) {
  const m = CFG.work.moraleMin;
  return m + (1 - m) * (u.morale / 100);
}
// tempo zbierania: baza surowca razy technika razy morale
function gatherRate(u) {
  const base = u.carryType === 'wood' ? CFG.chop * (hasTech(u.fac, 'siekiery') ? 1.2 : 1) : u.carryType === 'food' ? CFG.butcher : CFG.mine;
  return base * workMult(u);
}
// tempo budowy: pierwszy budowniczy pełną mocą, każdy kolejny z dołem 50%, przy morale 100 zachowuje formułę 1 + 0.5*(n-1)
function buildSpeed(builders) {
  return 0.5 + builders.reduce((a, u) => a + workMult(u) * 0.5, 0);
}
// tempo farmy: baza razy technika razy morale
function farmRate(u) {
  return CFG.buildings.farm.foodRate * (hasTech(u.fac, 'plug') ? 1.3 : 1) * ((S.rainT && S.rainT[u.fac] > 0) ? 2 : 1) * workMult(u);
}
// ============================== ZDOLNOŚCI MEDICINE MANA (formuły 19.4) ==============================
// deszcz: wszystkie pola frakcji +100% plonów przez 60 s, cooldown 180 s; koszt: brak (rytualny taniec)
function castRain(u) {
  if (u.type !== 'medicine' || (u.rainCd || 0) > 0) return;
  u.rainCd = CFG.abilities.rain.cd;
  S.rainT[u.fac] = CFG.abilities.rain.dur;
  uiAlert('Taniec deszczu: pola dają podwójny plon przez ' + CFG.abilities.rain.dur + ' s');
  sfx('ok');
}
// burza: obszar promień 3 wokół szamana, 10 obrażeń/s przez 5 s, jednorazowo morale wrogów -20, cooldown 120 s
function castStorm(u) {
  if (u.type !== 'medicine' || (u.stormCd || 0) > 0) return;
  u.stormCd = CFG.abilities.storm.cd;
  S.storms.push({ x: u.x, y: u.y, fac: u.fac, t: CFG.abilities.storm.dur });
  for (const e of S.units) {
    if (e.fac === u.fac || e.fac === 'neutral') continue;
    if ((e.x - u.x) ** 2 + (e.y - u.y) ** 2 <= CFG.abilities.storm.r * CFG.abilities.storm.r)
      e.morale = Math.max(0, e.morale - CFG.abilities.storm.morale);
  }
  uiAlert('Burza nad wrogiem (' + CFG.abilities.storm.dur + ' s)');
}
// tick zdolności: cooldowny jednostek, czas deszczu, obrażenia i czas burz
function updateAbilities(dt) {
  for (const u of S.units) {
    if (u.type !== 'medicine') continue;
    if (u.rainCd > 0) u.rainCd = Math.max(0, u.rainCd - dt);
    if (u.stormCd > 0) u.stormCd = Math.max(0, u.stormCd - dt);
  }
  for (const fac in S.rainT) if (S.rainT[fac] > 0) S.rainT[fac] -= dt;
  const dmg = CFG.abilities.storm.dps * dt;
  for (const st of S.storms) {
    st.t -= dt;
    for (const e of S.units) {
      if (e.fac === st.fac || e.fac === 'neutral') continue;

    case 'survive': return S.time - m.t0 >= c.t;

}
function runAction(a) {

  switch (a.type) {
    case 'message': uiAlert(a.text); break;
    case 'spawn': for (const o of a.buildings || []) spawnMissionBuilding(o); for (const o of a.units || []) spawnMissionUnit(o); break;
    case 'setFlag': m.flags[a.name] = a.value === undefined ? true : a.value; break;
    case 'setRes': for (const k in a.res) addRes(k, a.res[k]); break;

    case 'order': for (const e of taggedAll(a.tag)) if (S.units.includes(e)) missionOrder(e, a.order); break;
    case 'win': endGame('win', a.text || 'Misja ukończona.'); break;

}
function startStage(i) {

function updateMission(dt) {

  if (!m || !d || S.gameOver) return;
  m.acc += dt; if (m.acc < 0.5) return; m.acc = 0;
  for (const u of S.units) if (u.tag) m.tags[u.tag] = true;
  for (const b of S.buildings) if (b.tag) m.tags[b.tag] = true;
  if (m.stage < 0) startStage(0);
  const sg = d.stages[m.stage];
  for (const f of [...(d.failIf || []), ...(sg.failIf || [])]) if (condMet(f)) { endGame('lose', f.text || 'Misja nieudana.'); return; }
  let all = true;
  for (const o of sg.objectives) {
    const key = sg.id + ':' + o.id;
    if (!m.done[key] && condMet(o)) { m.done[key] = true; if (!o.optional && o.text) uiAlert('Cel wykonany: ' + o.text); }
    if (!o.optional && !m.done[key]) all = false;
  }
  if (!all) return;
  for (const a of sg.onComplete || []) { runAction(a); if (S.gameOver) return; }
  if (m.stage + 1 < d.stages.length) startStage(m.stage + 1); else endGame('win', d.winText || 'Misja ukończona.');
}

// ============================== AI BANDYTÓW ==============================
// zalew BFS po kaflach spełniających predykat free, start z seeds; zwraca maskę osiągalności
function floodFrom(free, seeds) {
  const seen = new Uint8Array(MAP * MAP);
  const q = [];
  for (const [sx, sy] of seeds) {
    if (!free(sx, sy)) continue;
    const i = idx(sx, sy);
    if (!seen[i]) { seen[i] = 1; q.push(i); }
  }
  let head = 0;
  while (head < q.length) {
    const cur = q[head++];
    const cx = cur % MAP, cy = (cur - cx) / MAP;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (!free(nx, ny)) continue;
      const ni = idx(nx, ny);
      if (!seen[ni]) { seen[ni] = 1; q.push(ni); }
    }
  }
  return seen;
}
function aiFindSpot(type, r) {
  const ehq = S.buildings.find(b => b.fac === 'enemy' && b.type === 'hq');
  if (!ehq) return null;
  const def = CFG.buildings[type];
  const spots = freeTilesAround(Math.floor(ehq.cx), Math.floor(ehq.cy), r);
  const seeds = freeTilesAround(Math.floor(ehq.cx), Math.floor(ehq.cy), 2);
  const free1 = (x, y) => inMap(x, y) && !isBlocked(x, y);
  const before = floodFrom(free1, seeds);
  for (const [tx, ty] of spots) {
    let ok = true;
    for (let y = ty; y < ty + def.h && ok; y++) for (let x = tx; x < tx + def.w && ok; x++)
      if (!inMap(x, y) || isBlocked(x, y)) ok = false;
    if (!ok) continue;
    // żadna jednostka nie stoi na footprincie: AI nie zabudowuje własnych robotników i koni
    if (S.units.some(u => Math.floor(u.x) >= tx && Math.floor(u.x) < tx + def.w && Math.floor(u.y) >= ty && Math.floor(u.y) < ty + def.h)) continue;
    // cel BFS (goalR): wolny kafel poza footprintem, osiągalny także PO zabudowaniu
    const gr = goalR({ w: def.w, h: def.h });
    const gx = Math.floor(tx + def.w / 2), gy = Math.floor(ty + def.h / 2);
    const inFp = (x, y) => x >= tx && x < tx + def.w && y >= ty && y < ty + def.h;
    const free2 = (x, y) => free1(x, y) && !inFp(x, y);
    const after = floodFrom(free2, seeds);
    const goals = [];
    for (let y = gy - gr; y <= gy + gr; y++) for (let x = gx - gr; x <= gx + gr; x++) {
      if (inFp(x, y)) continue;
      if (free1(x, y)) goals.push([x, y]);
    }
    if (!goals.some(g => after[idx(g[0], g[1])])) continue;
    // footprint nie może odciąć jednostki wroga ani dzikiego konia od reszty mapy
    let seals = false;
    for (const u of S.units) {
      if (u.fac === 'player') continue;
      const ux = Math.floor(u.x), uy = Math.floor(u.y);
      if (!free1(ux, uy)) continue; // jednostka już uwięzona lub na niedostępnym kafu: nie blokuje placementu
      if (before[idx(ux, uy)] && !after[idx(ux, uy)]) { seals = true; break; }
    }
    if (seals) continue;
    return [tx, ty];
  }
  return null;
}
function aiPlace(type) {
  const def = CFG.buildings[type];
  const spot = aiFindSpot(type, CFG.ai.buildR);
  if (!spot || !canAfford(def.cost, 'enemy')) return false;
  if (!pay(def.cost, 'enemy')) return false;
  const b = addBuilding(type, spot[0], spot[1], 'enemy');
  // budowniczy: najbliżsi robotnicy bandytów, gather przerwany (orderGather wznawia po budowie)
  const ws = S.units.filter(u => u.fac === 'enemy' && u.type === 'worker' && u.state !== 'flee');
  ws.sort((a, c) => ((a.x - b.cx) ** 2 + (a.y - b.cy) ** 2) - ((c.x - b.cx) ** 2 + (c.y - b.cy) ** 2));
  if (ws.length) assignBuilders(b, [ws[0]]);
  return true;
}
function aiTrain(b, unitType) {
  if (!b || !b.built || b.queue.length >= CFG.ai.trainCap) return false;
  const def = CFG.units[unitType];
  if (popUsed('enemy') + queuedCount('enemy') >= popCap('enemy')) return false;
  if (!pay(def.cost, 'enemy')) return false;
  b.queue.push({ type: unitType, remaining: def.train, paid: true });
  return true;
}
function aiAttack(target, hitsBuildings = true) {
  let sent = 0;
  for (const u of S.units) {
    if (u.fac !== 'enemy' || u.type === 'worker' || u.type === 'horse') continue;
    if (u.state === 'assault' || u.state === 'flee') continue;
    u.attackTarget = null; u.node = null; releaseFarm(u); u.buildTarget = null;
    u.path = pathToBuildingU(u, target); u.pathI = 0;
    // 'move' zamiast 'assault': na miejscu armia walczy tylko z jednostkami w zasięgu agresji i nie rusza budynków (bardzo łatwy)
    if (hitsBuildings) { u.orderBuilding = target; u.state = 'assault'; } else { u.orderBuilding = null; u.state = 'move'; }
    sent++;
  }
  return sent;
}
function updateAI(dt) {
  if (S.testMode || missionRule('ai', true) === false) return; // tryb testowy i misje bez AI: kontroler strategiczny milczy, zostaje tylko auto-aggro jednostek
  const A = CFG.ai, D = diffOf(), st = S.ai;
  st.thinkT -= dt;
  st.attackCd -= dt;
  if (st.thinkT > 0) return;
  st.thinkT = A.thinkEvery;
  const R = S.resE;
  const ehq = S.buildings.find(b => b.fac === 'enemy' && b.type === 'hq' && b.built);
  if (!ehq) return;
  const myWorkers = S.units.filter(u => u.fac === 'enemy' && u.type === 'worker');
  const myArmy = S.units.filter(u => u.fac === 'enemy' && u.type !== 'worker' && u.type !== 'horse' && u.state !== 'assault');
  const barr = S.buildings.find(b => b.fac === 'enemy' && b.type === 'barracks' && b.built);
  // 1. robotnicy (trening w obozie)
  const queuedW = ehq.queue.filter(q => q.type === 'worker').length;
  if (myWorkers.length + queuedW < D.workers) aiTrain(ehq, 'worker');
  // 2. bezczynni robotnicy: surowiec wg potrzeb albo farmowanie
  const myFarms = S.buildings.filter(b => b.fac === 'enemy' && b.type === 'farm' && b.built);
  for (const u of myWorkers) {
    if (u.state !== 'idle' && u.state !== 'gather') continue;
    if (u.state === 'gather' && u.node && S.amt[idx(u.node[0], u.node[1])] > 0) continue;
    const freeFarm = myFarms.find(f => !f.busy);
    if (freeFarm && R.food < 150) {
      freeFarm.busy = u.id; u.farm = freeFarm; u.node = null; u.buildTarget = null;
      u.path = pathToBuildingU(u, freeFarm); u.pathI = 0;
      u.state = u.path.length ? 'toFarm' : 'farming';
    } else orderGatherAuto(u, R.wood < 200 ? T_FOREST : T_GOLD);
  }
  // 2a. watchdog budowy: budowla bez budowniczego blokuje bramkę unbuilt i całą rozbudowę
  for (const b of S.buildings.slice()) {
    if (b.fac !== 'enemy' || b.built) continue;
    b.aiAge = (b.aiAge || 0) + A.thinkEvery;
    const hasBuilder = S.units.some(u => u.fac === 'enemy' && u.buildTarget === b && (u.state === 'building' || u.state === 'toBuild'));
    if (hasBuilder) b.aiAge = 0; // wiek liczy czas ciągłego braku budowniczego, nie czas budowy
    else if (b.aiAge > 60) {
      // rozbiórka martwej budowli: połowa kosztu wraca, robotnicy odzyskani
      for (const u of S.units) if (u.buildTarget === b) { u.buildTarget = null; u.state = 'idle'; }
      S.buildings = S.buildings.filter(x => x !== b);
      for (const k in CFG.buildings[b.type].cost) addRes(k, Math.floor(CFG.buildings[b.type].cost[k] / 2), 'enemy');
    } else if (!hasBuilder) {
      const ws = S.units.filter(u => u.fac === 'enemy' && u.type === 'worker' && u.state !== 'flee');
      ws.sort((p, q) => ((p.x - b.cx) ** 2 + (p.y - b.cy) ** 2) - ((q.x - b.cx) ** 2 + (q.y - b.cy) ** 2));
      // tylko robotnik z realną ścieżką (lub już przy ścianie): uwięziony robotnik nie blokuje budowy
      for (const w of ws) {
        if (pathToBuilding(w.x, w.y, b, CFG.units[w.type]).length || Math.hypot(b.cx - w.x, b.cy - w.y) <= (b.w + b.h) / 2 + 1.5) { assignBuilders(b, [w]); break; }
      }
    }
  }
  // 3. budowa (co najwyżej jedna na turę myśli, robotnik zbierający zostaje przerwany)
  const storeh = S.buildings.filter(b => b.fac === 'enemy' && b.type === 'storehouse' && b.built).length;
  const houses = S.buildings.filter(b => b.fac === 'enemy' && b.type === 'house' && b.built).length;
  const unbuilt = S.buildings.some(b => b.fac === 'enemy' && !b.built);
  if (!unbuilt) {
    if (!storeh) aiPlace('storehouse');
    else if (myFarms.length < 1 + Math.floor((myArmy.length + myWorkers.length) / A.farmsPer)) aiPlace('farm');
    else if (!barr) aiPlace('barracks');
    else if (popUsed('enemy') + 2 >= popCap('enemy')) aiPlace('house');
    else if (storeh < 2 && R.wood > 250) aiPlace('storehouse');
  }
  // 4. trening wojska w koszarach
  if (barr) {
    const armyAt = Math.min(A.armyCap, D.armyBase + A.armyGrow * st.attacks);
    const leaders = myArmy.filter(u => u.type === 'bandleader').length;
    const barrQ = barr.queue.length;
    if (myArmy.length + barrQ < armyAt) {
      if (!leaders && myArmy.length >= 5) aiTrain(barr, 'bandleader');
      else if (S.time > 600 && R.horses >= 1 && rng() < 0.3) aiTrain(barr, 'konnobanda');
      else aiTrain(barr, 'desperado');
    }
  }
  // 5. wyprawa łupieżcza (karencja startowa 8 min: fabryka+broń+2 piechota muszą być osiągalne)
  const armyAt = Math.min(A.armyCap, D.armyBase + A.armyGrow * st.attacks);
  if (myArmy.length >= armyAt && st.attackCd <= 0 && S.time > D.firstWave) {
    const phq = S.buildings.find(b => b.fac === 'player' && b.type === 'hq' && b.built);
    let target = phq;
    let bd = 1e9;
    for (const b of S.buildings) {
      if (b.fac !== 'player' || !b.built) continue;
      const d = (b.cx - ehq.cx) ** 2 + (b.cy - ehq.cy) ** 2;
      if (d < bd) { bd = d; target = b; }
    }
    if (target && aiAttack(target, D.hitsBuildings) > 0) {
      st.attacks++; st.attackCd = A.attackCooldown * D.waveMul;
      if (S.buildings.some(b => b.fac === 'player' && b.type === 'hq'))
        uiAlert('Zwiadowcy donoszą: banda ruszyła na twoją osadę!', [target.cx, target.cy]);
    }
  }
}

// koło widzenia o promieniu r kafli wokół (cx, cy) wpisane do maski; explored (opcjonalnie) zapamiętuje odkryty teren gracza
function stampDisc(mask, cx, cy, r, explored) {
  const ux = Math.floor(cx), uy = Math.floor(cy);
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (dx * dx + dy * dy > r * r) continue;
    const x = ux + dx, y = uy + dy;
    if (inMap(x, y)) { mask[idx(x, y)] = 1; if (explored) explored[idx(x, y)] = 1; }
  }
}
function computeFog() {
  S.visible.fill(0);
  for (const u of S.units) if (u.fac === 'player') stampDisc(S.visible, u.x, u.y, CFG.units[u.type].sight || CFG.fogRadius, S.explored);
  for (const b of S.buildings) if (b.fac === 'player') stampDisc(S.visible, b.cx, b.cy, CFG.fogHq, S.explored);
}
// maska widzenia wroga: bez niej wróg "widziałby" wszystko; atak zaczyna się tylko na cel, który frakcja widzi (patrz seenBy), liczona rzadziej niż mgła gracza
function computeFogEnemy() {
  const V = S.visibleE; V.fill(0);
  for (const u of S.units) if (u.fac === 'enemy') stampDisc(V, u.x, u.y, CFG.units[u.type].sight || CFG.fogRadius);
  for (const b of S.buildings) if (b.fac === 'enemy') stampDisc(V, b.cx, b.cy, CFG.fogHq);
}
// czy frakcja fac widzi jednostkę e (maska gracza albo wroga); neutralni nikogo nie wypatrują
function seenBy(fac, e) {
  const m = fac === 'enemy' ? S.visibleE : fac === 'player' ? S.visible : null;
  return !!m && !!m[idx(Math.min(MAP - 1, Math.max(0, Math.floor(e.x))), Math.min(MAP - 1, Math.max(0, Math.floor(e.y))))];
}

function endGame(result, msg) {
  S.gameOver = result;
  const mid = S.mission && S.mission.id;   // powtórka misji zaczyna tę samą misję, nie potyczkę
  showOverlay({
    title: result === 'win' ? 'Zwycięstwo!' : 'Porażka', body: msg,
    buttons: [
      { label: 'Jeszcze raz', cb: () => { if (mid) newMission(mid, Date.now()); else newGame(Date.now()); updatePanels(); } },
      // świeża partia pod menu: setupTest działa na bieżącym stanie, a ten ma jeszcze gameOver
      { label: 'Menu', cb: () => { newGame(Date.now()); updatePanels(); showMenu(); } },
    ],
  });
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const mini = document.getElementById('minimap');
const mctx = mini.getContext('2d');
const cam = { x: 0, y: 0 };
let canvasW = 800, canvasH = 600;
function resize() {
  const ratio = Math.min(window.devicePixelRatio || 1, SETTINGS.quality ? 2 : 1);   // niska jakość: bez nadpróbkowania na ekranach o dużym DPR
  canvasW = window.innerWidth; canvasH = window.innerHeight;
  canvas.width = Math.round(canvasW * ratio); canvas.height = Math.round(canvasH * ratio);
  canvas.style.width = canvasW + 'px'; canvas.style.height = canvasH + 'px';
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.imageSmoothingEnabled = false; // zoom całkowity: piksel-art musi zostać ostry
}
window.addEventListener('resize', resize);

function screenToTile(mx, my) {
  // px ekranu → px świata (render skaluje ctx przez ZOOM, kamera w px świata)
  const sx = mx / ZOOM - cam.x, sy = my / ZOOM - cam.y;
  const px = (sx / (CFG.tileW / 2) + sy / (CFG.tileH / 2)) / 2;
  const py = (sy / (CFG.tileH / 2) - sx / (CFG.tileW / 2)) / 2;
  return [px, py];
}
function tileToScreen(px, py) {
  return [(px - py) * CFG.tileW / 2 + cam.x, (px + py) * CFG.tileH / 2 + cam.y];
}
function centerCameraOn(px, py) {
  cam.x = canvasW / (2 * ZOOM) - (px - py) * CFG.tileW / 2;
  cam.y = canvasH / (2 * ZOOM) - (px + py) * CFG.tileH / 2;
}
function clampCam() {
  const bw = MAP * CFG.tileW / 2;  // połowa szerokości rombu mapy w px świata (cam też w px świata)
  const bh = MAP * CFG.tileH;     // wysokość rombu mapy w px świata
  cam.x = Math.max(canvasW / ZOOM - bw, Math.min(bw, cam.x));
  cam.y = Math.max(canvasH / ZOOM - bh, Math.min(0, cam.y));
}

// zmiana przybliżenia wokół punktu ekranu (fx, fy): punkt świata pod palcem/kursorem zostaje w miejscu
function setZoom(z, fx, fy) {
  z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z)); if (z === ZOOM) return;
  const wx = fx / ZOOM - cam.x, wy = fy / ZOOM - cam.y;
  ZOOM = z; cam.x = fx / ZOOM - wx; cam.y = fy / ZOOM - wy; clampCam();
}
let mouse = { x: 400, y: 300, down: false, dragging: false, sx: 0, sy: 0, inside: false };
const keys = {};

  if (isTouch(e)) return touchDown(e);

canvas.addEventListener('pointerleave', () => { mouse.inside = false; });

// puszczenie przycisku nad panelem UI: bez tego następny klik robił gigantyczną ramkę zaznaczania

function onCanvasUp(e) {
  mouse.down = false;
  if (S.gameOver) return;
  const right = e.button === 2;

  const ex = e.offsetX / ZOOM, ey = e.offsetY / ZOOM;

}

// tryb testowy: deterministyczne rozmieszczenie budowli spiralą wokół obozu
function testPlace(fac, type, cx, cy) {
  const def = CFG.buildings[type];
  for (let r = 3; r <= 14; r++) {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue; // tylko obwód pierścienia
      const tx = cx + dx - Math.floor(def.w / 2), ty = cy + dy - Math.floor(def.h / 2);
      let ok = true;
      for (let y = ty; y < ty + def.h && ok; y++) for (let x = tx; x < tx + def.w; x++)
        if (!inMap(x, y) || isBlocked(x, y)) { ok = false; break; }
      if (ok) { const b = addBuilding(type, tx, ty, fac); b.built = true; b.progress = 1; return b; }
    }
  }
  return null;
}
function setupTest(race) {
  S.testMode = true;
  S.playerRace = race || 'settler';
  S.units = [];
  S.rainT = {}; S.storms = []; // zdolności nie przeciekają między partiami
  S.buildings = S.buildings.filter(b => b.type === 'hq');
  const phq = S.buildings.find(b => b.fac === 'player');
  const ehq = S.buildings.find(b => b.fac === 'enemy');
  for (const t of raceOf('player').test.buildings)
    testPlace('player', t, Math.floor(phq.cx), Math.floor(phq.cy));
  for (const t of ['storehouse', 'farm', 'barracks', 'factory', 'house', 'house'])
    testPlace('enemy', t, Math.floor(ehq.cx), Math.floor(ehq.cy));
  S.res = { ...raceOf('player').test.res };
  S.resE = { wood: 500, food: 500, gold: 1000, guns: 50, horses: 20 };
  // jednostki dopiero PO zabudowie: spawn na wolnych kaflach wokół obozu
  const ps = freeTilesAround(Math.floor(phq.cx), Math.floor(phq.cy), 5);
  const es = freeTilesAround(Math.floor(ehq.cx), Math.floor(ehq.cy), 5);
  let pi = 0, ei = 0;
  const spawnP = t => { if (pi < ps.length) { const u = addUnit(t, 'player', ps[pi][0], ps[pi][1]); u.x += 0.5; u.y += 0.5; pi++; } };
  const spawnE = t => { if (ei < es.length) { const u = addUnit(t, 'enemy', es[ei][0], es[ei][1]); u.x += 0.5; u.y += 0.5; ei++; } };
  for (let i = 0; i < 6; i++) spawnE('worker');
  const tu = raceOf('player').test.units;
  for (const t in tu) for (let i = 0; i < tu[t]; i++) spawnP(t);
  for (let i = 0; i < 10; i++) spawnE('desperado');
  for (let i = 0; i < 3; i++) spawnE('bandleader');
  for (let i = 0; i < 4; i++) spawnE('konnobanda');
  S.ai = newAIState();
  computeFog();
  centerCameraOn(phq.cx, phq.cy + 4);
  updateTopbar(); updatePanels();
}

}
function drawTree(sx, sy, v) {
  drawStatic(['tree_oak0', 'tree_pine', 'tree_dead', 'tree_oak1'][v || 0], sx, sy);
}
// rekwizyt terenowy: pozycja deterministyczna z pozycji kafla, zawsze wewnątrz rombu (max |ox|/32+|oy|/16 = 0.875 < 1)
function drawProp(x, y, cx, cy) {
  if (drawShoreReeds(x, y, cx, cy)) return;
  const r = sprNoise(x, y, 11), PB = biomeDef().props; if (r >= PB[3]) return;
  const ox = (sprNoise(x, y, 12) - 0.5) * 28, oy = (sprNoise(x, y, 13) - 0.5) * 14, v = sprNoise(x, y, 14);
  if (r < PB[0]) drawStatic('prop_rock' + Math.floor(v * 3), cx + ox, cy + oy);
  else if (r < PB[1]) drawStatic('prop_bush' + (v < 0.5 ? 0 : 1), cx + ox, cy + oy);
  else if (r < PB[2]) drawStatic('prop_tuft' + (v < 0.5 ? 0 : 1), cx + ox, cy + oy);   // zielone kępki
  else drawStatic('prop_tuft2', cx + ox, cy + oy);   // sucha kępa
}
// budynek wg nacji (styl, nie kolor właściciela): wróg = Desperado (ban), gracz = Osadnicy (us) albo Sioux (sx); brak wariantu = sprite Osadników
function drawBld(b, sx, sy) {
  const nat = raceOf(b.fac).nation, A = window.ASSETS;
  const key = 'bld_' + b.type + '_' + nat;
  drawStatic(A[key] ? key : 'bld_' + b.type + '_us', sx, sy);
}
function drawBuilding(b) {
  const def = CFG.buildings[b.type];
  const [sx, sy] = tileToScreen(b.cx, b.cy);
  const w = b.w * CFG.tileW / 2, h = b.h * CFG.tileH;
  if (!b.built) {
    // duch budynku: bryła materializuje się wraz z postępem, rusztowanie = przerywana elipsa
    ctx.globalAlpha = 0.15 + 0.5 * b.progress;
    drawBld(b, sx, sy);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#c9a35f'; ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.ellipse(sx, sy, w, h / 2, 0, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#e8d9b0'; ctx.font = '12px Georgia'; ctx.textAlign = 'center';
    ctx.fillText(Math.floor(b.progress * 100) + '%', sx, sy - h / 4);
    return;
  }
  drawBld(b, sx, sy);
  ctx.fillStyle = b.fac === 'enemy' ? '#ff8f6f' : '#f0e2bd';
  ctx.font = '11px Georgia'; ctx.textAlign = 'center';
  ctx.fillText(def.label, sx, sy + b.h * CFG.tileH / 2 - 6);
  if (b.hp < b.maxHp) drawHpBar(sx, sy + b.h * CFG.tileH / 2 + 6, w, b.hp / b.maxHp, b.fac === 'enemy');
  if (b.packing) drawProgBar(sx, sy + b.h * CFG.tileH / 2 - 30, 40, 1 - b.packing.t / CFG.packTime);
  if (b.queue.length) {
    ctx.fillStyle = '#ffd97a'; ctx.font = '11px Georgia';
    ctx.fillText('⏳' + Math.ceil(b.queue[0].remaining) + 's', sx, sy + b.h * CFG.tileH / 2 - 18);
  }
}
// padlina po zwierzynie: ciemna bryła mięsa z jaśniejszym rozłupem i kreską kości
function drawCarcass(sx, sy) { drawStatic('carcass', sx, sy); }
// kierunek rysowania: ruch, cel ataku/szturmu, miejsce pracy; indeks 0-7 wg kolejności kierunków w arkuszu (yaw painted = kierunek w osiach (x, -y) gry)
function unitHeading(u) {
  let dx = u.fdx, dy = u.fdy;
  if (u.state === 'attack' && u.attackTarget) { dx = u.attackTarget.x - u.x; dy = u.attackTarget.y - u.y; }
  else if (u.state === 'assault' && u.orderBuilding) { dx = u.orderBuilding.cx - u.x; dy = u.orderBuilding.cy - u.y; }
  else if (u.state === 'gather' && u.node) { dx = u.node[0] + 0.5 - u.x; dy = u.node[1] + 0.5 - u.y; }
  else if (u.state === 'building' && u.buildTarget) { dx = u.buildTarget.cx - u.x; dy = u.buildTarget.cy - u.y; }
  else if (u.state === 'farming' && u.farm) { dx = u.farm.cx - u.x; dy = u.farm.cy - u.y; }
  if (dx === undefined || (Math.abs(dx) < 1e-3 && Math.abs(dy) < 1e-3)) return u.hd === undefined ? 7 : u.hd;
  let yaw = Math.atan2(-dy, dx) * 180 / Math.PI; if (yaw < 0) yaw += 360;
  u.hd = Math.round(yaw / 45) % 8;
  return u.hd;
}
function drawUnitPre(u, sx, sy) {
  const e = window.ASSETS[u.type]; if (!e) return sy - 20;
  const row = unitHeading(u);
  const moving = u.path.length && ['move', 'toNode', 'toDeposit', 'toBuild', 'toFarm', 'toCapture', 'flee', 'attack', 'assault'].includes(u.state);
  const col = e.phases > 1 && moving ? Math.floor((u.walkD || 0) / 0.42) % e.phases : 0;
  let by = 0, kx = 0;
  if (u.state === 'gather' || u.state === 'farming' || u.state === 'building') by = Math.sin(S.time * 16 + u.id) * 0.7;
  if (u.kick > 0) kx = u.facing * 2 * (u.kick / 0.15);
  const img = e.file_p ? (u.fac === 'enemy' ? e._imge : e._imgp) : e._img;
  const fx = col * (e.fw + e.pad), fy = row * (e.fh + e.pad), dx = Math.round(sx + kx - e.ax * AK), dy = Math.round(sy + 2 + by - e.ay * AK);
  ctx.imageSmoothingEnabled = true;
  if (SETTINGS.shadow && SETTINGS.quality) ctx.drawImage(e._sh, fx, fy, e.fw, e.fh, dx, dy, e.fw * AK, e.fh * AK);
  ctx.drawImage(img, fx, fy, e.fw, e.fh, dx, dy, e.fw * AK, e.fh * AK);
  return sy + 2 + by - e.ay * AK;   // górna krawędź sprite'a (do pasków nad jednostką)
}
function drawUnit(u) {
  const [sx, sy] = tileToScreen(u.x, u.y);
  const topY = drawUnitPre(u, sx, sy);
  if (u.carry > 0) {
    ctx.fillStyle = u.carryType === 'wood' ? '#8a6b45' : '#e8c34a';
    ctx.fillRect(sx + 6, sy - 14, 6, 6);
  }
  if (u.hp < u.maxHp) drawHpBar(sx, topY - 2, 18, u.hp / u.maxHp, u.fac === 'enemy');
  if (u.state === 'unpacking') drawProgBar(sx, topY - 10, 30, 1 - u.unpackT / CFG.packTime);
  if (u.state === 'flee') {
    ctx.fillStyle = '#ff4a4a'; ctx.font = 'bold 13px Georgia'; ctx.textAlign = 'center';
    ctx.fillText('!', sx, topY - 6);
  } else if (u.morale < 60) {
    ctx.fillStyle = '#000'; ctx.fillRect(sx - 10, topY - 8, 20, 4);
    ctx.fillStyle = '#e8c34a'; ctx.fillRect(sx - 9, topY - 7, 18 * Math.max(0, u.morale / 100), 2);
  }
  // doświadczenie: trzecia statystyka oryginału, pasek po drodze do progu + poziom (gwiazdka z cyfrą)
  if (u.xp > 0) {
    const X = CFG.xp;
    const prev = u.lvl > 0 ? X.thresholds[u.lvl - 1] : 0;
    const next = u.lvl < X.thresholds.length ? X.thresholds[u.lvl] : null;
    const frac = next ? (u.xp - prev) / (next - prev) : 1;
    ctx.fillStyle = '#000'; ctx.fillRect(sx - 10, topY - 13, 20, 3);
    ctx.fillStyle = '#5a8fd4'; ctx.fillRect(sx - 9, topY - 12, 18 * Math.max(0, Math.min(1, frac)), 1);
    if (u.lvl > 0) {
      ctx.fillStyle = '#8ab4ea'; ctx.font = '10px Georgia'; ctx.textAlign = 'left';
      ctx.fillText('✦' + u.lvl, sx + 12, topY - 5);
    }
  }
}
// pasek postępu czynności (pakowanie i rozkładanie tepee): złoty na ciemnym tle
function drawProgBar(cx, y, w, frac) {
  ctx.fillStyle = '#000'; ctx.fillRect(cx - w / 2, y, w, 5);
  ctx.fillStyle = '#ffd97a'; ctx.fillRect(cx - w / 2 + 1, y + 1, (w - 2) * Math.max(0, Math.min(1, frac)), 3);
}
function drawHpBar(sx, sy, w, frac, enemy) {
  ctx.fillStyle = '#000'; ctx.fillRect(sx - w / 2 - 1, sy - 1, w + 2, 5);
  ctx.fillStyle = enemy ? '#d14a1e' : '#5fae4a';
  ctx.fillRect(sx - w / 2, sy, w * Math.max(0, frac), 3);
}
function renderMinimap() {
  mctx.fillStyle = '#000'; mctx.fillRect(0, 0, 160, 160);
  const px = 160 / MAP;
  for (let y = 0; y < MAP; y++) for (let x = 0; x < MAP; x++) {
    const i = idx(x, y);
    if (!S.explored[i]) continue;
    const t = S.terrain[i];
    mctx.fillStyle = t === T_FOREST ? '#2c4a1e' : t === T_GOLD ? '#e8c34a' : t === T_WATER ? '#3a6272' : t === T_MEAT ? '#a05a3a' : t === T_THICK ? '#1c3812' : t === T_CLIFF ? '#5a3a22' : biomeDef().mini;
    mctx.fillRect(x * px, y * px, px, px);
  }
  for (const b of S.buildings) {
    if (!S.explored[idx(Math.min(MAP - 1, Math.floor(b.cx)), Math.min(MAP - 1, Math.floor(b.cy)))]) continue;
    mctx.fillStyle = b.fac === 'enemy' ? '#ff5f5f' : '#7fd4ff';
    mctx.fillRect(b.tx * px, b.ty * px, b.w * px, b.h * px);
  }
  for (const u of S.units) {
    const ux = Math.min(MAP - 1, Math.floor(u.x)), uy = Math.min(MAP - 1, Math.floor(u.y));
    if ((u.fac === 'enemy' || u.fac === 'neutral') && !S.visible[idx(ux, uy)]) continue;
    mctx.fillStyle = u.fac === 'enemy' ? '#ff8f6f' : u.fac === 'neutral' ? '#c9a35f' : '#fff';
    mctx.fillRect(u.x * px - 1, u.y * px - 1, 2.5, 2.5);
  }
  // widok kamery: w izometrii ekranowy prostokąt to romb w kaflach, więc rysujemy cztery narożniki, nie dwa
  mctx.strokeStyle = '#fff'; mctx.lineWidth = 1;
  mctx.beginPath();
  [[0, 0], [canvasW, 0], [canvasW, canvasH], [0, canvasH]].forEach(([sx, sy], i) => {
    const [tx, ty] = screenToTile(sx, sy);
    if (i === 0) mctx.moveTo(tx * px, ty * px); else mctx.lineTo(tx * px, ty * px);
  });
  mctx.closePath(); mctx.stroke();
}

// ============================== MAIN ==============================
const STEP_MS = 1000 / 60;
const MAX_FRAME_MS = 250;
let prevTime = 0, acc = 0, uiTimer = 0;
function frame(now) {
  acc += Math.min(now - prevTime, MAX_FRAME_MS) * settingVal('speed');
  prevTime = now;
  let stepped = false;
  while (acc >= STEP_MS) { update(STEP_MS / 1000); acc -= STEP_MS; stepped = true; }
  // kamera (cs w px świata: przy zoomie 2x ta sama prędkość na ekranie wymaga 2x większego kroku)
  const cs = 12 * ZOOM * settingVal('scroll');
  if (keys.ArrowLeft || keys.a) cam.x += cs;
  if (keys.ArrowRight || keys.d) cam.x -= cs;
  if (keys.ArrowUp || keys.w) cam.y += cs;
  if (keys.ArrowDown || keys.s) cam.y -= cs;
  if (mouse.inside) {
    if (mouse.x < 24) cam.x += cs; if (mouse.x > canvasW - 24) cam.x -= cs;
    if (mouse.y < 24) cam.y += cs; if (mouse.y > canvasH - 24) cam.y -= cs;
  }
  clampCam();
  cancelBtn.style.display = aiming() && !S.menuOpen ? 'block' : 'none';
  render();
  uiTimer += 1;
  if (stepped && uiTimer % 15 === 0) { updateTopbar(); updatePanels(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) prevTime = performance.now(); });

applyUiScale(); initGroupRow(); resize();
document.getElementById('hudtoggle').onclick = () => { const on = document.documentElement.classList.toggle('hudmin'); document.getElementById('hudtoggle').textContent = on ? '▴' : '▾'; };
const cancelBtn = document.getElementById('cancelbtn');
// pointerdown zamiast samego click: po przeciągnięciu palcem przeglądarka potrafi na chwilę zgubić dotknięcie jako click, a Anuluj musi działać zawsze
const cancelAim = () => { S.placing = null; S.attackMove = false; S.rallyMode = false; S.patrolMode = false; };
cancelBtn.onclick = cancelAim; cancelBtn.addEventListener('pointerdown', cancelAim);
overlay.style.display = 'flex'; overlay.innerHTML = '<div class="box"><h2>Ładowanie…</h2></div>';
loadAssets().then(ok => {
  if (!ok) { overlay.innerHTML = '<div class="box"><h2>Brak zasobów graficznych</h2><p>Nie załadowano katalogu <code>assets/</code> (obok index.html). Uruchom grę z całego repozytorium.</p></div>'; return; }
  newGame((Date.now() % 2147483647) >>> 0);
  updateTopbar(); updatePanels();
  showMenu();
  window.GAME_READY = true;
  requestAnimationFrame(t => { prevTime = t; requestAnimationFrame(frame); });
});
</script>
