<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>America: prototyp</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1410; font-family: Georgia, 'Times New Roman', serif; user-select: none; }
  #game { position: absolute; inset: 0; touch-action: none; cursor: default; }
  .panel { position: absolute; background: rgba(43, 31, 20, 0.92); border: 2px solid #8a6b45; border-radius: 6px; color: #e8d9b0; }
  #topbar { top: 8px; left: 50%; transform: translateX(-50%); padding: 6px 16px; display: flex; gap: 18px; align-items: center; font-size: 15px; white-space: nowrap; }
  #topbar b { color: #ffd97a; }
  #buildbar { bottom: 8px; left: 8px; padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; max-width: 460px; }
  #buildbar button, #bpanel button, #stancebar button { background: #5a4128; color: #f0e2bd; border: 1px solid #8a6b45; padding: 7px 10px; font-family: inherit; font-size: 13px; border-radius: 4px; cursor: pointer; }
  #buildbar button:hover:not(:disabled), #bpanel button:hover:not(:disabled), #stancebar button:hover:not(:disabled) { background: #7a5836; }
  #buildbar button:disabled { opacity: 0.45; cursor: not-allowed; }
  #stancebar { bottom: 8px; left: 480px; padding: 8px; display: none; gap: 6px; flex-wrap: wrap; max-width: 340px; }
  #stancebar button.active { background: #a5822f; border-color: #ffd97a; color: #fff6dd; }
  #bpanel { bottom: 8px; left: 480px; padding: 8px; display: none; min-width: 220px; }
  #bpanel .name { color: #ffd97a; font-size: 14px; margin-bottom: 6px; }
  #bpanel .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #minimapWrap { position: absolute; bottom: 8px; right: 8px; border: 2px solid #8a6b45; border-radius: 4px; overflow: hidden; background: #000; }
  #minimap { display: block; }
  #alerts { position: absolute; top: 52px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none; }
  .alert { background: rgba(43, 31, 20, 0.95); border: 1px solid #b06a3a; color: #ffd97a; padding: 4px 14px; border-radius: 4px; font-size: 14px; animation: fadeout 6s forwards; }
  @keyframes fadeout { 0% {opacity: 1;} 80% {opacity: 1;} 100% {opacity: 0;} }
  #overlay { position: absolute; inset: 0; background: rgba(20, 12, 6, 0.88); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #overlay .box { max-width: 560px; background: #2b1f14; border: 3px solid #8a6b45; border-radius: 8px; padding: 28px 34px; color: #e8d9b0; }
  #overlay h1 { color: #ffd97a; font-size: 26px; margin-bottom: 10px; }
  #overlay h2 { color: #ffd97a; font-size: 20px; margin-bottom: 10px; }
  #overlay p { margin: 8px 0; font-size: 15px; line-height: 1.5; }
  #overlay ul { margin: 10px 0 10px 22px; font-size: 15px; line-height: 1.6; }
  #overlay button { margin-top: 14px; background: #7a5836; color: #fff; border: 1px solid #a8845c; padding: 10px 22px; font-size: 16px; border-radius: 5px; cursor: pointer; font-family: inherit; }
  #overlay button:hover { background: #96703f; }
  #helpbtn { position: absolute; top: 8px; right: 8px; padding: 6px 12px; background: #5a4128; color: #f0e2bd; border: 1px solid #8a6b45; border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 14px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="topbar" class="panel"></div>
<button id="helpbtn">?</button>
<div id="alerts"></div>
<div id="buildbar" class="panel"></div>
<div id="bpanel" class="panel"></div>
<div id="stancebar" class="panel"></div>
<div id="abilitybar" class="panel"></div>
<div id="minimapWrap"><canvas id="minimap" width="160" height="160"></canvas></div>
<div id="overlay"></div>
<script>
'use strict';
// ============================== CONFIG ==============================
const CFG = {
  map: 40, tileW: 64, tileH: 32,
  startRes: { wood: 300, food: 150, gold: 0, guns: 0, horses: 0 },
  resCap: { wood: 500, food: 500, gold: 2000, guns: 200, horses: 20 },
  carry: 10, chop: 2.5, mine: 1.5, butcher: 3,
  fogRadius: 6, fogHq: 8,
  morale: { tick: 1.0, deathR: 6, deathPenalty: 2, hitPenalty: 1, regen: 0.2, restR: 10, restRegen: 1.0, hqAuraR: 8, hqAura: 0.5, leaderAuraR: 6, leaderAura: 0.5, fleeAt: 30, fleeTime: 5, fleeBreak: 30, fleeDist: 4, wodzDeath: 30 },
  // zdolności medicine mana [Ź 19.4]: deszcz +100% plonów na wszystkich polach 60 s, burza r3 10 obr./s 5 s + morale wrogów -20
  abilities: { rain: { dur: 60, cd: 180 }, storm: { dur: 5, cd: 120, r: 3, dps: 10, morale: 20 } },
  xp: { hit: 2, kill: 10, thresholds: [25, 75, 150] },
  work: { xpRate: 0.5, moraleMin: 0.6 },
  ai: {
    thinkEvery: 2.0, startRes: { wood: 250, food: 250, gold: 60, guns: 0, horses: 0 },
    workersMax: 3, farmsPer: 5, armyBase: 4, armyGrow: 2, armyCap: 12,
    attackCooldown: 150, trainCap: 3, buildR: 6,
  },
  units: {
    worker:    { hp: 50,  dmg: 4,  range: 1, cd: 1.0, speed: 1.0, cost: { food: 30 }, train: 12, aggro: 0, letter: 'W', color: '#3a7bd5', kind: 'melee', hunter: true, builder: true, farmer: true },
    // frakcja Sioux, statystyki z 19.2 [Ź]: squaw buduje i farmi, nie rąbie; wojownik rąbie, kopie i poluje; łuk kosztuje drewno, nie broń palną
    squaw:     { hp: 35,  dmg: 2,  range: 1, cd: 1.0, speed: 1.0, cost: { food: 20 }, train: 10, aggro: 0, letter: 'S', color: '#c46a8a', kind: 'melee', builder: true, farmer: true, swim: true },
    wojownik:  { hp: 55,  dmg: 7,  range: 1, cd: 1.0, speed: 1.0, cost: { food: 25 }, train: 10, aggro: 0, letter: 'I', color: '#a05a30', kind: 'melee', hunter: true, woodcutter: true, swim: true },
    lucznik:   { hp: 45,  dmg: 9,  range: 7, cd: 1.1, speed: 1.0, cost: { food: 30, wood: 5 }, train: 12, aggro: 6, letter: 'Ł', color: '#7a9a4a', kind: 'bow', swim: true },
    medicine:  { hp: 50,  dmg: 3,  range: 6, cd: 1.5, speed: 1.0, cost: { food: 50, gold: 30 }, train: 25, aggro: 0, letter: 'M', color: '#4a8a6a', kind: 'bow', swim: true },
    wodz:      { hp: 100, dmg: 12, range: 1, cd: 1.0, speed: 1.1, cost: { food: 60, gold: 50 }, train: 30, aggro: 5, letter: 'C', color: '#d1a02f', kind: 'melee', limit: 1, swim: true },
    piechota:  { hp: 60,  dmg: 12, range: 5, cd: 1.0, speed: 1.0, cost: { food: 40, gold: 10, guns: 1 }, train: 20, aggro: 6, letter: 'P', color: '#2f5d8a', kind: 'gun' },
    desperado: { hp: 50,  dmg: 10, range: 4, cd: 1.2, speed: 1.1, cost: { food: 40, gold: 10 }, train: 15, aggro: 6, letter: 'D', color: '#a12f2f', kind: 'gun', hunter: true },
    bandleader:{ hp: 90,  dmg: 14, range: 5, cd: 1.0, speed: 1.1, cost: { food: 80, gold: 20 }, train: 25, aggro: 6, letter: 'B', color: '#d14a1e', kind: 'gun' },
    jezdiec:   { hp: 70,  dmg: 12, range: 4, cd: 1.2, speed: 1.8, cost: { food: 40, gold: 10, guns: 1, horses: 1 }, train: 25, aggro: 6, letter: 'J', color: '#6a4a8a', kind: 'gun', cav: true },
    konnobanda:{ hp: 60,  dmg: 12, range: 1, cd: 0.9, speed: 1.7, cost: { food: 40, gold: 10, horses: 1 }, train: 20, aggro: 7, letter: 'J', color: '#c03a2a', kind: 'melee', cav: true },
    horse:     { hp: 40,  dmg: 0,  range: 0, cd: 1.0, speed: 0.7, cost: {}, train: 0, aggro: 0, letter: 'K', color: '#8a5a3a' },
    bizon:     { hp: 45,  dmg: 0,  range: 0, cd: 1.0, speed: 0.8, cost: {}, train: 0, aggro: 0, letter: 'B', color: '#5a4030', animal: true, meat: 150 },
    bydlo:     { hp: 25,  dmg: 0,  range: 0, cd: 1.0, speed: 0.5, cost: {}, train: 0, aggro: 0, letter: 'C', color: '#a89a85', animal: true, meat: 100 },
  },
  buildings: {
    hq:         { w: 3, h: 3, hp: 1200, cost: {}, build: 60, pop: 10, deposit: true, label: 'OBÓZ', color: '#6e4f2a' },
    house:      { w: 2, h: 2, hp: 200, cost: { wood: 60, gold: 20 }, build: 25, pop: 10, label: 'DOM', color: '#7a5c33' },
    farm:       { w: 2, h: 2, hp: 100, cost: { wood: 40 }, build: 20, foodRate: 0.6, upkeep: 0.02, label: 'FARMA', color: '#8a7a33' },
    storehouse: { w: 2, h: 2, hp: 150, cost: { wood: 50 }, build: 15, deposit: true, label: 'MAGAZYN', color: '#6a6a5a' },
    barracks:   { w: 2, h: 2, hp: 300, cost: { wood: 100, gold: 40 }, build: 40, label: 'KOSZARY', color: '#5a4a6a' },
    factory:    { w: 2, h: 2, hp: 300, cost: { wood: 120, gold: 80 }, build: 45, gunTime: 15, gunCost: { wood: 5, gold: 10 }, label: 'FABRYKA', color: '#4a4a5a' },
    zagroda:    { w: 2, h: 2, hp: 220, cost: { wood: 70, gold: 40 }, build: 30, horseTime: 30, horseCost: { food: 20, gold: 10 }, label: 'ZAGRODA', color: '#8a6a4a' },
    tepee:      { w: 2, h: 2, hp: 120, cost: { wood: 30 }, build: 10, pop: 5, label: 'TEPEE', color: '#9a6a3a' },
  },
  techs: {
    siekiery: { bld: 'hq', cost: { food: 50 }, time: 30, name: 'Ostrzone siekiery', desc: 'wycinka +20%' },
    plug:     { bld: 'hq', cost: { food: 80, gold: 30 }, time: 40, name: 'Pług', desc: 'plony +30%' },
    selekcja: { bld: 'zagroda', cost: { food: 100, gold: 40 }, time: 50, name: 'Selekcja koni', desc: 'hodowla 30 -> 24 s' },
    sztauga:  { bld: 'barracks', cost: { gold: 100 }, time: 45, name: 'Kowbojska sztauga', desc: 'jeźdźcy +10% HP' },
  },
};
const BUILD_MENU_SETTLER = [
  { type: 'house', key: 'H', name: 'Dom' }, { type: 'farm', key: 'F', name: 'Farma' },
  { type: 'storehouse', key: 'M', name: 'Magazyn' }, { type: 'barracks', key: 'K', name: 'Koszary' },
  { type: 'factory', key: 'B', name: 'Fabryka broni' },
  { type: 'zagroda', key: 'Z', name: 'Zagroda koni' },
];
// Sioux: tepee zamiast domu (pop +5), bez fabryki broni (łuki robią się z drewna) i bez zagrody (brak kawalerii); koszary produkują łuczników i medicine manów
const BUILD_MENU_SIOUX = [
  { type: 'tepee', key: 'E', name: 'Tepee' }, { type: 'farm', key: 'F', name: 'Farma' },
  { type: 'storehouse', key: 'M', name: 'Magazyn' }, { type: 'barracks', key: 'K', name: 'Koszary' },
];
function buildMenuFor(race) { return race === 'sioux' ? BUILD_MENU_SIOUX : BUILD_MENU_SETTLER; }
// produkcja z budynków per frakcja: obóz Osadników wypuszcza robotnika, obóz Sioux squawę, wojownika i wodza; koszary różnie
function trainMenuFor(b, race) {
  if (b.type === 'hq') return race === 'sioux' ? ['squaw', 'wojownik', 'wodz'] : ['worker'];
  if (b.type === 'barracks') return race === 'sioux' ? ['lucznik', 'medicine'] : ['piechota', 'jezdiec'];
  return [];
}

// ============================== RNG ==============================
function mulberry32(seed) {
  let s = seed >>> 0;
  return function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let rng = mulberry32(1);

// ============================== STATE ==============================
const MAP = CFG.map;
const T_GRASS = 0, T_FOREST = 1, T_GOLD = 2, T_WATER = 3, T_MEAT = 4, T_THICK = 5;
// przybliżenie kamery: świat rysowany przez transform ZOOM; 2 = piksel-art 2x bez wygładzania, 1 = stara skala
const ZOOM = 2;
const S = {};
const idx = (x, y) => y * MAP + x;
const inMap = (x, y) => x >= 0 && y >= 0 && x < MAP && y < MAP;

function newGame(seed, race) {
  S.playerRace = race || S.playerRace || 'settler';
  rng = mulberry32(seed >>> 0);
  S.time = 0; S.nextId = 1;
  S.res = { ...CFG.startRes };
  S.techs = { player: {}, enemy: {} };
  S.terrain = new Uint8Array(MAP * MAP);
  S.amt = new Float32Array(MAP * MAP);
  S.buildings = []; S.units = [];
  S.explored = new Uint8Array(MAP * MAP);
  S.visible = new Uint8Array(MAP * MAP);
  S.selected = { units: [], building: null };
  S.groups = {}; S.lastGroup = 0; S.lastGroupT = 0;
  S.placing = null; S.gameOver = null;
  S.alertCooldown = {};
  S.pending = [];
  S.woodAlertT = 0;
  S.moraleT = 0;
  S.rainT = {};   // pozostały czas deszczu per frakcja (aktywny tylko dla frakcji z medicine manem)
  S.storms = [];  // aktywne burze: { x, y, fac, t }
  S.shots = [];
  S.hits = [];
  S.muted = false;
  S.testMode = false;
  S.menuOpen = false;
  // gospodarka bandytów: własne zasoby i kontroler AI (fale zastąpione realną produkcją)
  S.resE = { ...CFG.ai.startRes };
  S.ai = { thinkT: 1, attacks: 0, attackCd: CFG.ai.attackCooldown, trainQ: 0 };

  genMap();
  const hq = addBuilding('hq', 33, 33, 'player');
  addBuilding('hq', 2, 2, 'enemy');
  // start per frakcja: Osadnicy 4 robotników, Sioux 2 squawy i 2 wojowników (asymetria ekonomii od pierwszej sekundy)
  const startU = S.playerRace === 'sioux' ? ['squaw', 'squaw', 'wojownik', 'wojownik'] : ['worker', 'worker', 'worker', 'worker'];
  const pu = [];
  for (let i = 0; i < 4; i++) {
    const u = addUnit(startU[i], 'player', 32 + (i % 2), 36 + Math.floor(i / 2));
    u.x += 0.5; u.y += 0.5;
    pu.push(u);
  }
  for (let i = 0; i < 3; i++) addUnit('desperado', 'enemy', 5 + i, 5).x += 0.5, S.units[S.units.length - 1].y += 0.5;
  const eWorkers = [];
  for (let i = 0; i < 2; i++) eWorkers.push(addUnit('worker', 'enemy', 6 + i, 4));
  orderGatherAuto(eWorkers[0], T_FOREST);
  orderGatherAuto(eWorkers[1], T_FOREST);
  computeFog();
  // startowe rozkazy: 2 drwale, 1 górnik, czwarty wolny (autostart gospodarki); Sioux: wojownicy rąbią, squawy czekają na budowę
  if (S.playerRace === 'sioux') {
    const wojs = pu.filter(u => u.type === 'wojownik');
    orderGatherAuto(wojs[0], T_FOREST); orderGatherAuto(wojs[1], T_FOREST);
  } else {
    orderGatherAuto(pu[0], T_FOREST); orderGatherAuto(pu[1], T_FOREST);
    orderGatherAuto(pu[2], T_GOLD);
  }
  centerCameraOn(34.5, 34.5);
}

function genMap() {
  // baza: trawa
  // kępy lasu
  const clusters = 9;
  for (let c = 0; c < clusters; c++) {
    const cx = 3 + Math.floor(rng() * (MAP - 6)), cy = 3 + Math.floor(rng() * (MAP - 6));
    const n = 14 + Math.floor(rng() * 16);
    for (let i = 0; i < n; i++) {
      const x = cx + Math.floor(rng() * 7 - 3), y = cy + Math.floor(rng() * 7 - 3);
      if (!inMap(x, y)) continue;
      S.terrain[idx(x, y)] = T_FOREST;
      S.amt[idx(x, y)] = 100;
    }
  }
  // gwarantowany las przy bazie gracza (kolumny 24-27 przeżywają czyszczenie strefy startowej)
  for (let i = 0; i < 10; i++) {
    const x = 24 + Math.floor(rng() * 4), y = 28 + Math.floor(rng() * 7);
    S.terrain[idx(x, y)] = T_FOREST; S.amt[idx(x, y)] = 100;
  }
  // żyły złota: przy bazie gracza, środek mapy, przy wrogu (poza strefami czyszczonymi)
  const veins = [[26, 26], [20, 20], [8, 10]];
  for (const [vx, vy] of veins) {
    for (let i = 0; i < 4; i++) {
      const x = vx + (i % 2), y = vy + Math.floor(i / 2);
      S.terrain[idx(x, y)] = T_GOLD; S.amt[idx(x, y)] = 1000;
    }
  }
  // wyczyść strefy startowe (promień 4 wokół obozów)
  for (const [ax, ay] of [[33.5, 33.5], [3.5, 3.5]]) {
    for (let y = Math.floor(ay - 5); y <= ay + 5; y++)
      for (let x = Math.floor(ax - 5); x <= ax + 5; x++)
        if (inMap(x, y)) { S.terrain[idx(x, y)] = T_GRASS; S.amt[idx(x, y)] = 0; }
  }
  // gęsty las [Ź 19.6]: tunel dla pieszych (Indianie 1.5, osadnicy 2.0), blokada dla konnych, wozów i zwierzyny; kępy poza strefami startowymi, przed spawnem stad
  for (const [tx, ty, n] of [[30, 24, 12], [10, 14, 12], [22, 6, 8]]) {
    for (let i = 0; i < n; i++) {
      const x = tx + Math.floor(rng() * 5 - 2), y = ty + Math.floor(rng() * 5 - 2);
      if (!inMap(x, y)) continue;
      S.terrain[idx(x, y)] = T_THICK; S.amt[idx(x, y)] = 0;
    }
  }
  // stada dzikich koni (neutralne, do schwytania przez każdą frakcję)
  for (const [hx, hy] of [[28, 24], [12, 26], [20, 10]]) {
    let placed = 0, tries = 0;
    while (placed < 5 + Math.floor(rng() * 4) && tries < 40) {
      tries++;
      const x = hx + Math.floor(rng() * 7) - 3, y = hy + Math.floor(rng() * 7) - 3;
      if (!inMap(x, y) || isBlocked(x, y)) continue;
      addUnit('horse', 'neutral', x + 0.5, y + 0.5);
      placed++;
    }
  }
  // stada zwierzyny łownej: bizony (19.6: 4-8 sztuk) i bydło, daleko od stref startowych [Ź dla bizonów w grze]
  // padlina po ubiciu staje się kafl żywności (T_MEAT), więc stada to drugie, odnawialne źródło prowiantu po farmach
  for (const [hx, hy, type, base, spread] of [[30, 12, 'bizon', 4, 4], [8, 22, 'bizon', 4, 4], [16, 18, 'bizon', 4, 4], [26, 30, 'bydlo', 3, 2], [12, 8, 'bydlo', 3, 2]]) {
    let placed = 0, tries = 0;
    while (placed < base + Math.floor(rng() * spread) && tries < 40) {
      tries++;
      const x = hx + Math.floor(rng() * 7) - 3, y = hy + Math.floor(rng() * 7) - 3;
      if (!inMap(x, y) || isBlocked(x, y)) continue;
      addUnit(type, 'neutral', x + 0.5, y + 0.5);
      placed++;
    }
  }
  // rzeka meandrująca przy wschodniej krawędzi: 2 kafle szerokości, meander ±1 kafel
  // przy krawędzi zamiast przez środek: czytelny akcent terenu bez odcinania ścieżek między bazami
  let rx = MAP - 4;
  for (let y = 1; y < MAP - 1; y++) {
    if (rng() < 0.3) rx = Math.max(MAP - 4, Math.min(MAP - 3, rx + (rng() < 0.5 ? -1 : 1)));
    S.terrain[idx(rx, y)] = T_WATER; S.amt[idx(rx, y)] = 0;
    S.terrain[idx(rx + 1, y)] = T_WATER; S.amt[idx(rx + 1, y)] = 0;
  }
  // czyszczenie surowców odciętych za rzeką (pasek wschodni: niedostępne dla robotników)
  for (let y = 0; y < MAP; y++) for (let x = MAP - 4; x < MAP; x++)
    if (S.terrain[idx(x, y)] === T_FOREST || S.terrain[idx(x, y)] === T_GOLD || S.terrain[idx(x, y)] === T_THICK)
      { S.terrain[idx(x, y)] = T_GRASS; S.amt[idx(x, y)] = 0; }
}

// ============================== SIM: BUDYNKI I JEDNOSTKI ==============================
function addBuilding(type, tx, ty, fac) {
  const def = CFG.buildings[type];
  const b = {
    id: S.nextId++, type, fac, tx, ty, w: def.w, h: def.h,
    cx: tx + def.w / 2, cy: ty + def.h / 2,
    hp: def.hp, maxHp: def.hp, built: type === 'hq', progress: 0,
    queue: [], on: true, busy: null,
  };
  S.buildings.push(b);
  return b;
}
function addUnit(type, fac, tx, ty) {
  const def = CFG.units[type];
  const hp = def.hp * (type === 'jezdiec' && hasTech(fac, 'sztauga') ? 1.1 : 1);
  const u = {
    id: S.nextId++, type, fac, x: tx, y: ty,
    hp, maxHp: hp, state: 'idle',
    path: [], pathI: 0, carry: 0, carryType: null,
    node: null, farm: null, buildTarget: null,
    attackTarget: null, orderBuilding: null,
    captureTarget: null, captureT: 0, grazeT: 3,
    morale: 100, fleeT: 0, fleeArmed: true, lastThreat: null,
    xp: 0, lvl: 0, stance: 'norm', ordered: false,
    cd: 0, repathT: 0, facing: 1,
  };
  S.units.push(u);
  return u;
}
function buildingAt(x, y) {
  for (const b of S.buildings)
    if (x >= b.tx && x < b.tx + b.w && y >= b.ty && y < b.ty + b.h) return b;
  return null;
}
function isBlocked(x, y) {
  if (!inMap(x, y)) return true;
  const t = S.terrain[idx(x, y)];
  if (t === T_FOREST || t === T_GOLD || t === T_WATER || t === T_THICK) return true;
  return !!buildingAt(x, y);
}
// ruch jednostek per teren [Ź 19.6]: rzeka tylko dla Indian (płyną), gęsty las tunelem dla pieszych (nie dla konnych i zwierzyny)
function passableFor(def, x, y) {
  if (!inMap(x, y)) return false;
  const t = S.terrain[idx(x, y)];
  if (t === T_WATER) return !!(def && def.swim);
  if (t === T_THICK) return !!(def && !def.cav && !def.animal);
  if (t === T_FOREST || t === T_GOLD) return false;
  return !buildingAt(x, y);
}
// koszt terenowy [Ź 19.6]: trawa 1.0, rzeka 0.5 dla Indian, gęsty las 1.5 Indianie / 2.0 piesi osadników
function terrainCost(def, x, y) {
  const t = inMap(x, y) ? S.terrain[idx(x, y)] : T_GRASS;
  if (t === T_WATER) return def && def.swim ? 0.5 : 1.0;
  if (t === T_THICK) return def && def.swim ? 1.5 : 2.0;
  return 1.0;
}
// jednostka w wodzie: płynie i nie atakuje [Ź 6.2/19.6]
function isSwimming(u) {
  return inMap(Math.floor(u.x), Math.floor(u.y)) && S.terrain[idx(Math.floor(u.x), Math.floor(u.y))] === T_WATER;
}
// wersje findPath/pathToBuilding dla jednostki: droga liczone przez passableFor jej definicji
function uPath(u, gx, gy, r) { return uPath(u, gx, gy, r, CFG.units[u.type]); }
function pathToBuildingU(u, b) { return pathToBuildingU(u, b, CFG.units[u.type]); }
function freeTilesAround(cx, cy, r) {
  const out = [];
  for (let y = cy - r; y <= cy + r; y++)
    for (let x = cx - r; x <= cx + r; x++)
      if (!isBlocked(x, y)) out.push([x, y]);
  return out;
}

// BFS: szuka drogi do pola w promieniu r od celu (lub samego celu, jeśli wolne); def = definicja jednostki decyduje o przejściach (rzeka, gęsty las)
function findPath(sx, sy, gx, gy, r, def) {
  r = r || 1;
  sx = Math.floor(sx); sy = Math.floor(sy);
  if (!inMap(sx, sy)) return [];
  const goalOk = (x, y) => Math.abs(x - gx) <= r && Math.abs(y - gy) <= r;
  const start = idx(sx, sy);
  if (goalOk(sx, sy)) return [];
  const prev = new Int32Array(MAP * MAP).fill(-1);
  const seen = new Uint8Array(MAP * MAP);
  const q = [start]; seen[start] = 1;
  let head = 0, found = -1;
  while (head < q.length) {
    const cur = q[head++];
    const cx = cur % MAP, cy = (cur - cx) / MAP;
    if (goalOk(cx, cy)) { found = cur; break; }
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (!inMap(nx, ny) || !passableFor(def, nx, ny)) continue;
      const ni = idx(nx, ny);
      if (seen[ni]) continue;
      seen[ni] = 1; prev[ni] = cur; q.push(ni);
    }
  }
  if (found === -1) return [];
  const path = [];
  let cur = found;
  while (cur !== start && cur !== -1) { path.push([cur % MAP, Math.floor(cur / MAP)]); cur = prev[cur]; }
  path.reverse();
  return path;
}
// cel-budynek: promień celu musi obejmować wolny pierścień przy footprincie,
// inaczej (cel = środek budynku 3x3) BFS nigdy nie znajdzie pola stopu
function goalR(b) {
  const m = Math.max(b.w, b.h);
  return m % 2 === 0 ? m / 2 : (m + 1) / 2;
}
function pathToBuilding(sx, sy, b, def) {
  return findPath(sx, sy, Math.floor(b.cx), Math.floor(b.cy), goalR(b), def);
}

// ============================== GOSPODARKA ==============================
function facRes(fac) { return fac === 'enemy' ? S.resE : S.res; }
function hasTech(fac, id) { return !!(S.techs && S.techs[fac || 'player'] && S.techs[fac || 'player'][id]); }
function canAfford(cost, fac) {
  const R = facRes(fac || 'player');
  for (const k in cost) if (R[k] < cost[k]) return false;
  return true;
}
function pay(cost, fac) {
  if (!canAfford(cost, fac)) return false;
  const R = facRes(fac || 'player');
  for (const k in cost) R[k] -= cost[k];
  return true;
}
function addRes(type, n, fac) { const R = facRes(fac || 'player'); R[type] = Math.min(CFG.resCap[type], R[type] + n); }
function popCap(fac) {
  let p = 0;
  for (const b of S.buildings) if (b.fac === (fac || 'player') && b.built) p += CFG.buildings[b.type].pop || 0;
  return p;
}
function popUsed(fac) { return S.units.filter(u => u.fac === (fac || 'player')).length; }
function deposits(fac) {
  return S.buildings.filter(b => b.fac === (fac || 'player') && b.built && CFG.buildings[b.type].deposit);
}
function nearestDeposit(u) {
  let best = null, bd = 1e9;
  for (const b of deposits(u.fac)) {
    const d = (b.cx - u.x) ** 2 + (b.cy - u.y) ** 2;
    if (d < bd) { bd = d; best = b; }
  }
  return best;
}
function findNodeNear(ter, x, y, r) {
  let best = null, bd = 1e9;
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    const nx = x + dx, ny = y + dy;
    if (!inMap(nx, ny) || S.terrain[idx(nx, ny)] !== ter || S.amt[idx(nx, ny)] <= 0) continue;
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = [nx, ny]; }
  }
  return best;
}
function orderGatherAuto(u, ter) {
  // fallback promienia: lokalny node, potem dalszy, na końcu cała mapa
  // (bez tego wyczerpany las w okolicy zostawia robotnika bezczynnym na zawsze)
  let node = findNodeNear(ter, Math.floor(u.x), Math.floor(u.y), 12);
  if (!node) node = findNodeNear(ter, Math.floor(u.x), Math.floor(u.y), 25);
  if (!node) node = findNodeNear(ter, Math.floor(u.x), Math.floor(u.y), MAP);
  if (node) orderGather(u, node[0], node[1]);
}
// zwolnienie farmy zajętej przez robotnika (przy zmianie rozkazu)
function releaseFarm(u) {
  for (const b of S.buildings) if (b.busy === u.id) b.busy = null;
  u.farm = null;
}
function orderGather(u, nx, ny) {
  u.node = [nx, ny];
  const gt = S.terrain[idx(nx, ny)];
  u.carryType = gt === T_FOREST ? 'wood' : gt === T_MEAT ? 'food' : 'gold';
  releaseFarm(u); u.buildTarget = null; u.attackTarget = null; u.orderBuilding = null;
  u.path = uPath(u, nx, ny); u.pathI = 0;
  u.state = u.path.length ? 'toNode' : 'gather';
}

// ============================== ROZKAZY (kolejka z wejścia) ==============================
function queueCmd(cmd) { S.pending.push(cmd); }
function addHitFx(x, y, o) {
  S.hits.push(Object.assign({ x, y, age: 0 }, o));
  if (S.hits.length > 60) S.hits.shift();
}
function addShot(u, tx, ty) {
  S.shots.push({ x0: u.x, y0: u.y, x1: tx, y1: ty, age: 0 });
  if (S.shots.length > 40) S.shots.shift();
  sfx('shot', u.x, u.y);
}
function processCmds() {
  while (S.pending.length) {
    const c = S.pending.shift();
    if (c.action === 'order') executeOrder(c);
    else if (c.action === 'place') tryPlace(c.type, c.x, c.y);
    else if (c.action === 'train') tryTrain(c.building, c.unitType);
    else if (c.action === 'research') tryResearch(c.building, c.techId);
    else if (c.action === 'toggle') { c.building.on = !c.building.on; }
    else if (c.action === 'resume') {
      if (!S.buildings.includes(c.building)) continue;
      const idle = S.units.filter(u => u.fac === 'player' && unitRole(u, 'builder') && u.state === 'idle');
      if (idle.length) assignBuilders(c.building, idle);
      else uiAlert('Brak bezczynnych robotników (PPM: wybrane robotnicy wznowią)');
    }
  }
}
function executeOrder(c) {
  const units = c.units.filter(u => S.units.includes(u) && u.state !== 'flee');
  if (c.units.some(u => S.units.includes(u) && u.state === 'flee')) uiAlert('Spanikowana jednostka ignoruje rozkazy');
  if (!units.length) return;
  sfx('order', c.x, c.y);
  // cel: jednostka wroga?
  const target = c.targetUnit && S.units.includes(c.targetUnit) ? c.targetUnit : null;
  // polowanie: klik na zwierzę; jednostki z flagą hunter (worker, desperado-łowca) atakują, reszta tylko podchodzi
  if (target && target.fac === 'neutral' && CFG.units[target.type] && CFG.units[target.type].animal) {
    for (const u of units) {
      if (CFG.units[u.type] && CFG.units[u.type].hunter) {
        u.attackTarget = target; u.ordered = true; u.node = null; releaseFarm(u); u.buildTarget = null; u.orderBuilding = null;
        u.state = 'attack';
      } else {
        u.node = null; releaseFarm(u); u.buildTarget = null; u.attackTarget = null; u.orderBuilding = null;
        u.path = uPath(u, c.x, c.y); u.pathI = 0; u.state = 'move';
      }
    }
    return;
  }
  const b = buildingAt(c.x, c.y);
  if (target && target.fac !== units[0].fac) {
    for (const u of units) {
      u.attackTarget = target; u.ordered = true; u.node = null; releaseFarm(u); u.buildTarget = null;
      u.state = 'attack';
    }
    return;
  }
  // schwytanie dzikiego konia (dowolna jednostka, 5 s [Ź])
  if (c.targetHorse && S.units.includes(c.targetHorse)) {
    const h = c.targetHorse;
    for (const u of units) {
      u.captureTarget = h; u.node = null; releaseFarm(u); u.buildTarget = null; u.attackTarget = null; u.orderBuilding = null;
      u.path = uPath(u, Math.floor(h.x), Math.floor(h.y)); u.pathI = 0;
      u.state = u.path.length ? 'toCapture' : 'capture';
    }
    return;
  }
  // budynek wroga albo własna farma
  if (b) {
    if (b.fac !== units[0].fac) {
      for (const u of units) { u.orderBuilding = b; u.attackTarget = null; releaseFarm(u); u.buildTarget = null; u.state = 'assault'; u.path = pathToBuildingU(u, b); u.pathI = 0; }
      return;
    }
    if (b.type === 'farm' && b.built) {
      const workers = units.filter(u => unitRole(u, 'farmer'));
      for (const u of workers) {
        if (b.busy && b.busy !== u.id) { uiAlert('Farma jest już zajęta'); continue; }
        releaseFarm(u);
        b.busy = u.id;
        u.farm = b; u.node = null; u.buildTarget = null; u.attackTarget = null;
        u.path = pathToBuildingU(u, b); u.pathI = 0;
        u.state = u.path.length ? 'toFarm' : 'farming';
      }
      const rest = units.filter(u => !unitRole(u, 'farmer'));
      for (const u of rest) { u.state = 'move'; u.path = uPath(u, c.x, c.y); u.pathI = 0; }
      return;
    }
    // nieukończona własna budowla: wznowienie budowy
    if (!b.built) {
      assignBuilders(b, units.filter(u => unitRole(u, 'builder')));
      for (const u of units.filter(u => !unitRole(u, 'builder'))) { u.state = 'move'; u.path = uPath(u, c.x, c.y); u.pathI = 0; }
      return;
    }
  }
  // surowiec?
  const ter = inMap(c.x, c.y) ? S.terrain[idx(c.x, c.y)] : T_GRASS;
  if ((ter === T_FOREST || ter === T_GOLD || ter === T_MEAT) && S.amt[idx(c.x, c.y)] > 0) {
    for (const u of units) {
      if (canGatherRes(u, ter)) orderGather(u, c.x, c.y);
      else { u.state = 'move'; u.path = uPath(u, c.x, c.y); u.pathI = 0; }
    }
    return;
  }
  // ruch
  for (const u of units) {
    u.node = null; releaseFarm(u); u.buildTarget = null; u.attackTarget = null; u.orderBuilding = null;
    u.path = uPath(u, c.x, c.y); u.pathI = 0;
    u.state = 'move';
  }
}
// role zawodowe jednostek: builder (buduje), farmer (uprawia), woodcutter (rąbie)
function unitRole(u, role) {
  const d = CFG.units[u.type];
  return !!(d && d[role]);
}
// kto może zbierać surowiec z mapy: robotnik wszystko, wojownik (woodcutter) drewno, złoto i padlinę, squaw nic [Ź 6.2, przydział złota i padliny decyzja własna]
function canGatherRes(u, ter) {
  if (u.type === 'worker') return true;
  const d = CFG.units[u.type];
  return !!(d && d.woodcutter && (ter === T_FOREST || ter === T_GOLD || ter === T_MEAT));
}
// przydziel robotników do budowy (nowej albo przerwanej)
function assignBuilders(b, workers) {
  for (const u of workers) {
    u.buildTarget = b; u.node = null; releaseFarm(u); u.attackTarget = null; u.orderBuilding = null;
    u.path = pathToBuildingU(u, b); u.pathI = 0;
    u.state = u.path.length ? 'toBuild' : 'building';
  }
}
function tryPlace(type, tx, ty) {
  const def = CFG.buildings[type];
  for (let y = ty; y < ty + def.h; y++) for (let x = tx; x < tx + def.w; x++)
    if (!inMap(x, y) || isBlocked(x, y)) { uiAlert('Nie można tu budować'); return; }
  if (!pay(def.cost)) { uiAlert('Brak surowców'); return; }
  const b = addBuilding(type, tx, ty, 'player');
  sfx('place', b.cx, b.cy);
  assignBuilders(b, S.selected.units.filter(u => unitRole(u, 'builder')));
}
function tryTrain(b, unitType) {
  if (!b.built || b.queue.length >= 5) return;
  const def = CFG.units[unitType];
  if (def.limit) {
    const cnt = S.units.filter(u => u.fac === b.fac && u.type === unitType).length + b.queue.filter(q => q.type === unitType).length;
    if (cnt >= def.limit) { uiAlert('Limit: maksymalnie ' + def.limit); return; }
  }
  if (popUsed(b.fac) + b.queue.length >= popCap(b.fac)) { uiAlert('Brak miejsc (zbuduj dom)'); return; }
  if (!pay(def.cost)) { uiAlert('Brak surowców'); return; }
  b.queue.push({ type: unitType, remaining: def.train });
}
function tryResearch(b, techId) {
  const td = CFG.techs[techId];
  if (!td || td.bld !== b.type || !b.built || b.research || hasTech(b.fac, techId)) return;
  if (!pay(td.cost, b.fac)) { uiAlert('Brak surowców'); return; }
  b.research = { id: techId, remaining: td.time };
}

// ============================== UPDATE ==============================
function update(dt) {
  if (S.gameOver) return;
  if (S.menuOpen) return; // menu startowe: symulacja stoi, kamera i render żyją
  S.time += dt;
  processCmds();
  for (const u of S.units) updateUnit(u, dt);
  for (const b of S.buildings) updateBuilding(b, dt);
  updateAbilities(dt);
  // morale: aktualizacja w dyskretnych krokach co 1 s (formuły 19.4)
  S.moraleT += dt;
  while (S.moraleT >= CFG.morale.tick) { S.moraleT -= CFG.morale.tick; updateMorale(); }
  // rozsunięcie jednostek
  const us = S.units;
  for (let i = 0; i < us.length; i++) for (let j = i + 1; j < us.length; j++) {
    const a = us[i], b = us[j];
    const dx = b.x - a.x, dy = b.y - a.y;
    const d2 = dx * dx + dy * dy;
    if (d2 > 0.0001 && d2 < 0.2) {
      const d = Math.sqrt(d2), push = (0.45 - d) * 0.5;
      const nx = dx / d, ny = dy / d;
      a.x -= nx * push * dt * 3; a.y -= ny * push * dt * 3;
      b.x += nx * push * dt * 3; b.y += ny * push * dt * 3;
    }
  }
  // klamp pozycji (separacja nie może wypchnąć poza mapę)
  for (const u of S.units) {
    u.x = Math.max(0.05, Math.min(MAP - 0.05, u.x));
    u.y = Math.max(0.05, Math.min(MAP - 0.05, u.y));
  }
  // AI bandytów: myśli zamiast sztucznych fal (gospodarka, trening, wyprawy łupieżcze)
  updateAI(dt);
  // kapitulacja gracza (reguła z patcha 1.02: brak obozu, przywódcy i robotników)
  const pUnits = S.units.filter(u => u.fac === 'player');
  if (!pUnits.some(u => u.type === 'worker') && pUnits.length === 0 && S.res.food < 30) endGame('lose', 'Twoja osada zniknęła z mapy. Dzikie czasy.');
  if (S.fx) { S.fx.age += dt; if (S.fx.age > 1) S.fx = null; }
  for (const sh of S.shots) sh.age += dt;
  S.shots = S.shots.filter(sh => sh.age < 0.25);
  for (const h of S.hits) h.age += dt;
  S.hits = S.hits.filter(h => h.age < 0.3);
  computeFog();
}

function stepSnd(u, dist) {
  // kroki liczone przebytym dystansem, nie czasem: jednostka stojąca nie hałasuje
  u.stepAcc = (u.stepAcc || 0) + dist;
  const hoof = u.type === 'jezdiec' || u.type === 'konnobanda';
  if (u.stepAcc >= (hoof ? 0.4 : 0.5)) { u.stepAcc = 0; sfx(hoof ? 'hoof' : 'step', u.x, u.y); }
}
function followPath(u, dt) {
  const def = CFG.units[u.type];
  const [nx, ny] = u.path[u.pathI];
  const tx = nx + 0.5, ty = ny + 0.5;
  const dx = tx - u.x, dy = ty - u.y;
  const d = Math.hypot(dx, dy);
  // koszt terenowy: rzeka 0.5 dla Indian, gęsty las 1.5/2.0, trawa 1.0 (tempo = speed / koszt)
  const step = def.speed * dt / terrainCost(def, Math.floor(u.x), Math.floor(u.y));
  if (d <= step) { u.x = tx; u.y = ty; stepSnd(u, Math.min(d, step)); u.pathI++; if (u.pathI >= u.path.length) { u.path = []; return true; } }
  else { u.x += dx / d * step; u.y += dy / d * step; if (Math.abs(dx) > 0.01) u.facing = dx > 0 ? 1 : -1; stepSnd(u, step); }
  return false;
}

function updateUnit(u, dt) {
  if (u.type === 'horse') { updateHorse(u, dt); return; }
  if (CFG.units[u.type] && CFG.units[u.type].animal) { updateAnimal(u, dt); return; }
  const def = CFG.units[u.type];
  u.cd = Math.max(0, u.cd - dt);
  u.kick = Math.max(0, (u.kick || 0) - dt);
  // wojsko: auto-nabór celu w promieniu agresji (neutralne konie nie są celem)
  const acqR = stanceAcquireR(u, def);
  if (acqR > 0 && !isSwimming(u) && !u.attackTarget && u.state !== 'assault' && u.state !== 'flee') {
    let best = null, bd = acqR * acqR;
    for (const e of S.units) {
      if (e.fac === u.fac || e.fac === 'neutral' || (e.fac === 'player' && !S.visible[idx(Math.floor(e.x), Math.floor(e.y))])) continue;
      const d = (e.x - u.x) ** 2 + (e.y - u.y) ** 2;
      if (d < bd) { bd = d; best = e; }
    }
    if (best) { u.attackTarget = best; u.ordered = false; u.state = 'attack'; }
  }
  switch (u.state) {
    case 'flee': {
      u.fleeT -= dt;
      if (u.path.length) followPath(u, dt);
      if (u.fleeT <= 0) {
        // nadal złamany: kolejna odsłona ucieczki, aż morale odbuduje się nad próg
        if (u.morale < CFG.morale.fleeAt) { startFlee(u); break; }
        if (u.orderBuilding && S.buildings.includes(u.orderBuilding)) u.state = 'assault';
        else if (u.node && inMap(u.node[0], u.node[1]) && S.amt[idx(u.node[0], u.node[1])] > 0) {
          u.path = uPath(u, u.node[0], u.node[1]); u.pathI = 0;
          u.state = u.path.length ? 'toNode' : 'gather';
        } else u.state = 'idle';
      }
      break;
    }
    case 'toCapture': {
      const h = u.captureTarget;
      if (!h || !S.units.includes(h)) { u.state = 'idle'; u.captureTarget = null; break; }
      const d = Math.hypot(h.x - u.x, h.y - u.y);
      if (d <= 1.9) { u.state = 'capture'; u.captureT = 5; u.path = []; break; }
      if (!u.path.length || followPath(u, dt)) {
        u.path = uPath(u, Math.floor(h.x), Math.floor(h.y)); u.pathI = 0;
        u.state = u.path.length ? 'toCapture' : 'idle';
      }
      break;
    }
    case 'capture': {
      const h = u.captureTarget;
      if (!h || !S.units.includes(h)) { u.state = 'idle'; u.captureTarget = null; break; }
      const d = Math.hypot(h.x - u.x, h.y - u.y);
      if (d > 2.2) { u.state = 'toCapture'; u.path = uPath(u, Math.floor(h.x), Math.floor(h.y)); u.pathI = 0; break; }
      u.captureT -= dt;
      if (u.captureT <= 0) {
        removeHorse(h);
        addRes('horses', 1, u.fac);
        u.captureTarget = null; u.state = 'idle';
        if (u.fac === 'player') { uiAlert('Schwycono konia (w zagrodzie: ' + Math.floor(S.res.horses) + ')'); sfx('ok'); }
      }
      break;
    }
    case 'idle': break;
    case 'move':
      if (!u.path.length || followPath(u, dt)) u.state = 'idle';
      break;
    case 'toNode': if (!u.path.length || followPath(u, dt)) u.state = 'gather'; break;
    case 'toDeposit': if (!u.path.length || followPath(u, dt)) u.state = 'deposit'; break;
    case 'toBuild': if (!u.path.length || followPath(u, dt)) u.state = 'building'; break;
    case 'toFarm': if (!u.path.length || followPath(u, dt)) u.state = 'farming'; break;
    case 'gather': {
      if (!u.node || !inMap(u.node[0], u.node[1]) || S.amt[idx(u.node[0], u.node[1])] <= 0) { switchToDeposit(u); break; }

      u.carry += take;

        if (def.range > 1) scareAnimals(t.x, t.y, 5); else if (tdef && tdef.animal) scareAnimal(t, u.x, u.y);

// ============================== MODEL WALKI (formuły 19.4) ==============================
// trafienie: clamp(0.75 + 0.05*(poziomA - poziomT) + 0.10*oskrzydlenie, 0.30, 0.95)
function hitChance(lvlA, lvlT, flank) {
  return Math.max(0.30, Math.min(0.95, 0.75 + 0.05 * (lvlA - lvlT) + 0.10 * flank));
}
// mnożniki typu z 19.4: wręcz x1.5 przeciw strzeleckim, kawaleria x1.5 przeciw artylerii,
// artyleria x0.5 przeciw pojedynczym pieszym, x2.0 przeciw budynkom (artyleria czeka na wdrożenie)
function typeMult(attackerDef, targetDef, targetIsBuilding) {
  const a = attackerDef.kind || 'melee';

// oryginał ma trzecią statystykę doświadczenia ale nie znamy jego tabel
function xpLevel(xp) {

function gainXp(u, n) {

// Gameswelt: doświadczenie rośnie z czasem każdej pracy (nie tylko walki), a morale wpływa na pracowitość.
// Mnożnik tempa pracy liniowy od morale: 100 daje 1.0, 0 daje moraleMin. Wartości własne, źródła nie podają tabel.
function workMult(u) {

// tempo zbierania: baza surowca razy technika razy morale
function gatherRate(u) {

function buildSpeed(builders) {

function farmRate(u) {

// ============================== ZDOLNOŚCI MEDICINE MANA (formuły 19.4) ==============================
// deszcz: wszystkie pola frakcji +100% plonów przez 60 s, cooldown 180 s; koszt: brak (rytualny taniec)
function castRain(u) {

function castStorm(u) {

  for (const e of S.units) {

}

function updateAbilities(dt) {
  for (const u of S.units) {
    if (u.type !== 'medicine') continue;
    if (u.rainCd > 0) u.rainCd = Math.max(0, u.rainCd - dt);
    if (u.stormCd > 0) u.stormCd = Math.max(0, u.stormCd - dt);

  for (const fac in S.rainT) if (S.rainT[fac] > 0) S.rainT[fac] -= dt;

// śmierć wodza: cała jego armia traci 30 morale [Ź 19.2], spadek jednorazowy, nie obszarowy
function applyWodzDeath(u) {

}
// Postawy (spec sterowania, naprawa wady z recenzji GameOver: ustawienia agresywności muszą realnie modyfikować automatyzm rozkazów):
// agresywna sama nabiera cele w promieniu agresji i goni bez ograniczeń, neutralna nabiera w zasięgu broni i goni do promienia agresji,
// obronna nie rusza się z miejsca, trzymaj pozycję dodatkowo nie nabiera celów sama. Rozkaz ręczny gracza zawsze goni.
const STANCE_MENU = [
  { id: 'aggr', name: 'Agresywna', key: 'G' },
  { id: 'norm', name: 'Neutralna', key: 'N' },
  { id: 'def', name: 'Obronna', key: 'O' },
  { id: 'hold', name: 'Trzymaj', key: 'T' },

// promień automatycznego nabycia celu zależny od postawy; jednostki wręcz (zasięg 1) nie mają promienia wykrycia,
// więc naboru nie zwęża się do zasięgu broni, zostaje promień agresji (decyzja własna: zasięg 1 kafla to cios, nie wykrywanie)

// ============================== MORALE ==============================
function updateMorale() {
  const M = CFG.morale;
  const hqs = {};
  for (const b of S.buildings) if (b.type === 'hq' && b.built) hqs[b.fac] = b;
  for (const u of S.units) {
    let m = u.morale + M.regen * (u.hp / u.maxHp);
    const hq = hqs[u.fac];
    if (hq && (hq.cx - u.x) ** 2 + (hq.cy - u.y) ** 2 <= M.hqAuraR * M.hqAuraR) m += M.hqAura;
    for (const l of S.units) {
      if (l.fac !== u.fac || (l.type !== 'bandleader' && l.type !== 'wodz')) continue;
      if ((l.x - u.x) ** 2 + (l.y - u.y) ** 2 <= M.leaderAuraR * M.leaderAuraR) { m += M.leaderAura; break; }
    }
    let enemyNear = false;
    for (const e of S.units) {
      if (e.fac === u.fac || e.fac === 'neutral') continue;
      if ((e.x - u.x) ** 2 + (e.y - u.y) ** 2 <= M.restR * M.restR) { enemyNear = true; break; }
    }
    if (!enemyNear) m += M.restRegen;
    u.morale = Math.max(0, Math.min(100, m));
    if (u.morale >= M.fleeAt) u.fleeArmed = true;
    if (u.fleeArmed && u.morale < M.fleeAt && u.state !== 'flee') startFlee(u);
  }

}
function updateAnimal(a, dt) {

      for (let t = 0; t < 6; t++) {
        const ang = Math.atan2(a.y - a.threatY, a.x - a.threatX) + (rng() - 0.5) * 1.6;
        const dist = 3 + rng();
        const tx = Math.floor(a.x + Math.cos(ang) * dist), ty = Math.floor(a.y + Math.sin(ang) * dist);
        if (!inMap(tx, ty) || isBlocked(tx, ty)) continue;
        a.path = findPath(a.x, a.y, tx, ty, 0, CFG.units[a.type]); a.pathI = 0;
        break;
      }
    }
    if (a.path.length) followPath(a, dt);
    return;
  }
  // spokojne błądzenie, wzorzec konia
  if (a.path.length) { followPath(a, dt); return; }
  a.grazeT -= dt;
  if (a.grazeT <= 0) {
    a.grazeT = 4 + rng() * 6;
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    const [dx, dy] = dirs[Math.floor(rng() * 4)];
    const tx = Math.floor(a.x) + dx, ty = Math.floor(a.y) + dy;
    if (!isBlocked(tx, ty)) { a.path = [[tx, ty]]; a.pathI = 0; }
  }
}

function updateBuilding(b, dt) {

    if (builders.length > 0) {

      for (const u of builders) gainXp(u, CFG.work.xpRate * dt);

      if (b.progress >= 1) {
        b.built = true; b.progress = 1;
        if (b.fac === 'player') { uiAlert(CFG.buildings[b.type].label + ' gotowy'); sfx('ok'); }

  if (b.research) {

      if (b.fac === 'player') { uiAlert('Opracowano: ' + CFG.techs[b.research.id].name); sfx('ok'); }
      b.research = null;
    }
  }
  // kolejka produkcji (obóz: robotnik, koszary: piechota)
  if (b.queue.length) {
    const q = b.queue[0];
    if (b.type === 'hq' && popUsed(b.fac) >= popCap(b.fac)) { /* czekaj na dom */ }
    else {
      q.remaining -= dt;
      if (q.remaining <= 0) {
        b.queue.shift();
        const spots = freeTilesAround(Math.floor(b.cx), Math.floor(b.cy), 3);
        if (spots.length) {
          const u = addUnit(q.type, b.fac, spots[0][0] + 0.5, spots[0][1] + 0.5);
          if (q.type === 'worker' && b.fac === 'player') { /* nowy robotnik bezczynny */ }
          if (b.fac === 'player') sfx('ok');
        }
      }
    }
  }
  // fabryka: produkcja broni
  if (b.type === 'factory' && b.on) {
    const fd = CFG.buildings.factory;
    b.gunAcc = (b.gunAcc || 0) + dt;
    if (b.gunAcc >= fd.gunTime && canAfford(fd.gunCost, b.fac)) {
      pay(fd.gunCost, b.fac); addRes('guns', 1, b.fac); b.gunAcc = 0;
    }
  }
  // zagroda: hodowla koni (1/30 s za 20 żywności + 10 złota, Selekcja koni 24 s)
  if (b.type === 'zagroda' && b.on) {
    const zd = CFG.buildings.zagroda;
    const t = hasTech(b.fac, 'selekcja') ? 24 : zd.horseTime;
    b.horseAcc = (b.horseAcc || 0) + dt;
    if (b.horseAcc >= t) {
      if (facRes(b.fac).horses < CFG.resCap.horses && canAfford(zd.horseCost, b.fac)) {
        pay(zd.horseCost, b.fac); addRes('horses', 1, b.fac); b.horseAcc = 0;
      } else { b.horseAcc = t; }
    }
  }

}

// ============================== AI BANDYTÓW ==============================
// zalew BFS po kaflach spełniających predykat free, start z seeds; zwraca maskę osiągalności
function floodFrom(free, seeds) {
  const seen = new Uint8Array(MAP * MAP);
  const q = [];
  for (const [sx, sy] of seeds) {
    if (!free(sx, sy)) continue;
    const i = idx(sx, sy);
    if (!seen[i]) { seen[i] = 1; q.push(i); }
  }
  let head = 0;
  while (head < q.length) {
    const cur = q[head++];
    const cx = cur % MAP, cy = (cur - cx) / MAP;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (!free(nx, ny)) continue;
      const ni = idx(nx, ny);
      if (!seen[ni]) { seen[ni] = 1; q.push(ni); }
    }
  }
  return seen;
}
function aiFindSpot(type, r) {
  const ehq = S.buildings.find(b => b.fac === 'enemy' && b.type === 'hq');
  if (!ehq) return null;
  const def = CFG.buildings[type];
  const spots = freeTilesAround(Math.floor(ehq.cx), Math.floor(ehq.cy), r);
  const seeds = freeTilesAround(Math.floor(ehq.cx), Math.floor(ehq.cy), 2);
  const free1 = (x, y) => inMap(x, y) && !isBlocked(x, y);
  const before = floodFrom(free1, seeds);
  for (const [tx, ty] of spots) {
    let ok = true;
    for (let y = ty; y < ty + def.h && ok; y++) for (let x = tx; x < tx + def.w && ok; x++)
      if (!inMap(x, y) || isBlocked(x, y)) ok = false;
    if (!ok) continue;
    // żadna jednostka nie stoi na footprincie: AI nie zabudowuje własnych robotników i koni
    if (S.units.some(u => Math.floor(u.x) >= tx && Math.floor(u.x) < tx + def.w && Math.floor(u.y) >= ty && Math.floor(u.y) < ty + def.h)) continue;
    // cel BFS (goalR): wolny kafel poza footprintem, osiągalny także PO zabudowaniu
    const gr = goalR({ w: def.w, h: def.h });
    const gx = Math.floor(tx + def.w / 2), gy = Math.floor(ty + def.h / 2);
    const inFp = (x, y) => x >= tx && x < tx + def.w && y >= ty && y < ty + def.h;
    const free2 = (x, y) => free1(x, y) && !inFp(x, y);
    const after = floodFrom(free2, seeds);
    const goals = [];
    for (let y = gy - gr; y <= gy + gr; y++) for (let x = gx - gr; x <= gx + gr; x++) {
      if (inFp(x, y)) continue;
      if (free1(x, y)) goals.push([x, y]);
    }
    if (!goals.some(g => after[idx(g[0], g[1])])) continue;
    // footprint nie może odciąć jednostki wroga ani dzikiego konia od reszty mapy
    let seals = false;
    for (const u of S.units) {
      if (u.fac === 'player') continue;
      const ux = Math.floor(u.x), uy = Math.floor(u.y);
      if (!free1(ux, uy)) continue; // jednostka już uwięzona lub na niedostępnym kafu: nie blokuje placementu
      if (before[idx(ux, uy)] && !after[idx(ux, uy)]) { seals = true; break; }
    }
    if (seals) continue;
    return [tx, ty];
  }
  return null;
}
function aiPlace(type) {
  const def = CFG.buildings[type];
  const spot = aiFindSpot(type, CFG.ai.buildR);
  if (!spot || !canAfford(def.cost, 'enemy')) return false;
  if (!pay(def.cost, 'enemy')) return false;
  const b = addBuilding(type, spot[0], spot[1], 'enemy');
  // budowniczy: najbliżsi robotnicy bandytów, gather przerwany (orderGather wznawia po budowie)
  const ws = S.units.filter(u => u.fac === 'enemy' && u.type === 'worker' && u.state !== 'flee');
  ws.sort((a, c) => ((a.x - b.cx) ** 2 + (a.y - b.cy) ** 2) - ((c.x - b.cx) ** 2 + (c.y - b.cy) ** 2));
  if (ws.length) assignBuilders(b, [ws[0]]);
  return true;
}
function aiTrain(b, unitType) {
  if (!b || !b.built || b.queue.length >= CFG.ai.trainCap) return false;
  const def = CFG.units[unitType];
  if (popUsed('enemy') + b.queue.length >= popCap('enemy')) return false;
  if (!pay(def.cost, 'enemy')) return false;
  b.queue.push({ type: unitType, remaining: def.train });
  return true;
}
function aiAttack(target) {
  let sent = 0;
  for (const u of S.units) {
    if (u.fac !== 'enemy' || u.type === 'worker' || u.type === 'horse') continue;
    if (u.state === 'assault' || u.state === 'flee') continue;
    u.orderBuilding = target; u.attackTarget = null; u.node = null; releaseFarm(u); u.buildTarget = null;
    u.path = pathToBuildingU(u, target); u.pathI = 0;
    u.state = 'assault';
    sent++;
  }
  return sent;
}
function updateAI(dt) {
  if (S.testMode) return; // tryb testowy: kontroler strategiczny milczy, zostaje tylko auto-aggro jednostek
  const A = CFG.ai, st = S.ai;
  st.thinkT -= dt;
  st.attackCd -= dt;
  if (st.thinkT > 0) return;
  st.thinkT = A.thinkEvery;
  const R = S.resE;
  const ehq = S.buildings.find(b => b.fac === 'enemy' && b.type === 'hq' && b.built);
  if (!ehq) return;
  const myWorkers = S.units.filter(u => u.fac === 'enemy' && u.type === 'worker');
  const myArmy = S.units.filter(u => u.fac === 'enemy' && u.type !== 'worker' && u.type !== 'horse' && u.state !== 'assault');
  const barr = S.buildings.find(b => b.fac === 'enemy' && b.type === 'barracks' && b.built);
  // 1. robotnicy (trening w obozie)
  const queuedW = ehq.queue.filter(q => q.type === 'worker').length;
  if (myWorkers.length + queuedW < A.workersMax) aiTrain(ehq, 'worker');
  // 2. bezczynni robotnicy: surowiec wg potrzeb albo farmowanie
  const myFarms = S.buildings.filter(b => b.fac === 'enemy' && b.type === 'farm' && b.built);
  for (const u of myWorkers) {
    if (u.state !== 'idle' && u.state !== 'gather') continue;
    if (u.state === 'gather' && u.node && S.amt[idx(u.node[0], u.node[1])] > 0) continue;
    const freeFarm = myFarms.find(f => !f.busy);
    if (freeFarm && R.food < 150) {
      freeFarm.busy = u.id; u.farm = freeFarm; u.node = null; u.buildTarget = null;
      u.path = pathToBuildingU(u, freeFarm); u.pathI = 0;
      u.state = u.path.length ? 'toFarm' : 'farming';
    } else orderGatherAuto(u, R.wood < 200 ? T_FOREST : T_GOLD);
  }
  // 2a. watchdog budowy: budowla bez budowniczego blokuje bramkę unbuilt i całą rozbudowę
  for (const b of S.buildings.slice()) {
    if (b.fac !== 'enemy' || b.built) continue;
    b.aiAge = (b.aiAge || 0) + A.thinkEvery;
    const hasBuilder = S.units.some(u => u.fac === 'enemy' && u.buildTarget === b && (u.state === 'building' || u.state === 'toBuild'));
    if (hasBuilder) b.aiAge = 0; // wiek liczy czas ciągłego braku budowniczego, nie czas budowy
    else if (b.aiAge > 60) {
      // rozbiórka martwej budowli: połowa kosztu wraca, robotnicy odzyskani
      for (const u of S.units) if (u.buildTarget === b) { u.buildTarget = null; u.state = 'idle'; }
      S.buildings = S.buildings.filter(x => x !== b);
      for (const k in CFG.buildings[b.type].cost) addRes(k, Math.floor(CFG.buildings[b.type].cost[k] / 2), 'enemy');
    } else if (!hasBuilder) {
      const ws = S.units.filter(u => u.fac === 'enemy' && u.type === 'worker' && u.state !== 'flee');
      ws.sort((p, q) => ((p.x - b.cx) ** 2 + (p.y - b.cy) ** 2) - ((q.x - b.cx) ** 2 + (q.y - b.cy) ** 2));
      // tylko robotnik z realną ścieżką (lub już przy ścianie): uwięziony robotnik nie blokuje budowy
      for (const w of ws) {
        if (pathToBuilding(w.x, w.y, b, CFG.units[w.type]).length || Math.hypot(b.cx - w.x, b.cy - w.y) <= (b.w + b.h) / 2 + 1.5) { assignBuilders(b, [w]); break; }
      }
    }
  }
  // 3. budowa (co najwyżej jedna na turę myśli, robotnik zbierający zostaje przerwany)
  const storeh = S.buildings.filter(b => b.fac === 'enemy' && b.type === 'storehouse' && b.built).length;
  const houses = S.buildings.filter(b => b.fac === 'enemy' && b.type === 'house' && b.built).length;
  const unbuilt = S.buildings.some(b => b.fac === 'enemy' && !b.built);
  if (!unbuilt) {
    if (!storeh) aiPlace('storehouse');
    else if (myFarms.length < 1 + Math.floor((myArmy.length + myWorkers.length) / A.farmsPer)) aiPlace('farm');
    else if (!barr) aiPlace('barracks');
    else if (popUsed('enemy') + 2 >= popCap('enemy')) aiPlace('house');
    else if (storeh < 2 && R.wood > 250) aiPlace('storehouse');
  }
  // 4. trening wojska w koszarach
  if (barr) {
    const armyAt = Math.min(A.armyCap, A.armyBase + A.armyGrow * st.attacks);
    const leaders = myArmy.filter(u => u.type === 'bandleader').length;
    const barrQ = barr.queue.length;
    if (myArmy.length + barrQ < armyAt) {
      if (!leaders && myArmy.length >= 5) aiTrain(barr, 'bandleader');
      else if (S.time > 600 && R.horses >= 1 && rng() < 0.3) aiTrain(barr, 'konnobanda');
      else aiTrain(barr, 'desperado');
    }
  }
  // 5. wyprawa łupieżcza (karencja startowa 8 min: fabryka+broń+2 piechota muszą być osiągalne)
  const armyAt = Math.min(A.armyCap, A.armyBase + A.armyGrow * st.attacks);
  if (myArmy.length >= armyAt && st.attackCd <= 0 && S.time > 480) {
    const phq = S.buildings.find(b => b.fac === 'player' && b.type === 'hq' && b.built);
    let target = phq;
    let bd = 1e9;
    for (const b of S.buildings) {
      if (b.fac !== 'player' || !b.built) continue;
      const d = (b.cx - ehq.cx) ** 2 + (b.cy - ehq.cy) ** 2;
      if (d < bd) { bd = d; target = b; }
    }
    if (target && aiAttack(target) > 0) {
      st.attacks++; st.attackCd = A.attackCooldown;
      if (S.buildings.some(b => b.fac === 'player' && b.type === 'hq'))
        uiAlert('Zwiadowcy donoszą: banda ruszyła na twoją osadę!');
    }
  }
}

function computeFog() {
  S.visible.fill(0);
  for (const u of S.units) {
    if (u.fac !== 'player') continue;
    const r = CFG.fogRadius;
    const ux = Math.floor(u.x), uy = Math.floor(u.y);
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r * r) continue;
      const x = ux + dx, y = uy + dy;
      if (inMap(x, y)) { S.visible[idx(x, y)] = 1; S.explored[idx(x, y)] = 1; }
    }
  }
  for (const b of S.buildings) {
    if (b.fac !== 'player') continue;
    const r = CFG.fogHq;
    const bx = Math.floor(b.cx), by = Math.floor(b.cy);
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r * r) continue;
      const x = bx + dx, y = by + dy;
      if (inMap(x, y)) { S.visible[idx(x, y)] = 1; S.explored[idx(x, y)] = 1; }
    }
  }
}

function endGame(result, msg) {
  S.gameOver = result;
  showOverlay(result === 'win'
    ? { title: 'Zwycięstwo!', body: msg }
    : { title: 'Porażka', body: msg });
}

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const mini = document.getElementById('minimap');
const mctx = mini.getContext('2d');
const cam = { x: 0, y: 0 };
let canvasW = 800, canvasH = 600;
function resize() {
  const ratio = window.devicePixelRatio || 1;
  canvasW = window.innerWidth; canvasH = window.innerHeight;
  canvas.width = Math.round(canvasW * ratio); canvas.height = Math.round(canvasH * ratio);
  canvas.style.width = canvasW + 'px'; canvas.style.height = canvasH + 'px';
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.imageSmoothingEnabled = false; // zoom całkowity: piksel-art musi zostać ostry
}
window.addEventListener('resize', resize);

function screenToTile(mx, my) {
  // px ekranu → px świata (render skaluje ctx przez ZOOM, kamera w px świata)
  const sx = mx / ZOOM - cam.x, sy = my / ZOOM - cam.y;
  const px = (sx / (CFG.tileW / 2) + sy / (CFG.tileH / 2)) / 2;
  const py = (sy / (CFG.tileH / 2) - sx / (CFG.tileW / 2)) / 2;
  return [px, py];
}
function tileToScreen(px, py) {
  return [(px - py) * CFG.tileW / 2 + cam.x, (px + py) * CFG.tileH / 2 + cam.y];
}
function centerCameraOn(px, py) {
  cam.x = canvasW / (2 * ZOOM) - (px - py) * CFG.tileW / 2;
  cam.y = canvasH / (2 * ZOOM) - (px + py) * CFG.tileH / 2;
}
function clampCam() {
  const bw = MAP * CFG.tileW / 2;  // połowa szerokości rombu mapy w px świata (cam też w px świata)
  const bh = MAP * CFG.tileH;     // wysokość rombu mapy w px świata
  cam.x = Math.max(canvasW / ZOOM - bw, Math.min(bw, cam.x));
  cam.y = Math.max(canvasH / ZOOM - bh, Math.min(0, cam.y));
}

let mouse = { x: 400, y: 300, down: false, dragging: false, sx: 0, sy: 0 };
const keys = {};
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('pointerdown', e => {
  ensureAudio();
  mouse.down = true; mouse.dragging = false;
  mouse.sx = e.offsetX; mouse.sy = e.offsetY;
  mouse.x = e.offsetX; mouse.y = e.offsetY;
});
canvas.addEventListener('pointermove', e => { mouse.x = e.offsetX; mouse.y = e.offsetY; if (mouse.down && (Math.abs(mouse.x - mouse.sx) > 4 || Math.abs(mouse.y - mouse.sy) > 4)) mouse.dragging = true; });
// puszczenie przycisku nad panelem UI: bez tego następny klik robił gigantyczną ramkę zaznaczania
window.addEventListener('pointerup', () => { mouse.down = false; mouse.dragging = false; });
canvas.addEventListener('pointerup', e => {
  mouse.down = false;
  if (S.gameOver) return;
  const right = e.button === 2;
  // współrzędne kliknięcia w przestrzeni świata (kamera jest przeskalowana przez ZOOM, offsetX jest raw)
  const ex = e.offsetX / ZOOM, ey = e.offsetY / ZOOM;
  const [px, py] = screenToTile(e.offsetX, e.offsetY);
  const tx = Math.floor(px), ty = Math.floor(py);
  if (S.placing && !right) { queueCmd({ action: 'place', type: S.placing, x: tx, y: ty }); if (!e.shiftKey) S.placing = null; mouse.dragging = false; return; }
  if (S.placing && right) { S.placing = null; return; }
  if (right) {
    if (!S.selected.units.length) return;
    let targetUnit = null, bd = 400;
    for (const u of S.units) {
      const isAnimal = u.fac === 'neutral' && CFG.units[u.type] && CFG.units[u.type].animal;
      if ((u.fac !== 'enemy' && !isAnimal) || !S.visible[idx(Math.min(MAP-1,Math.floor(u.x)), Math.min(MAP-1,Math.floor(u.y)))]) continue;
      const [usx, usy] = tileToScreen(u.x, u.y);
      const d = (usx - ex) ** 2 + (usy - ey) ** 2;
      if (d < bd) { bd = d; targetUnit = u; }
    }
    let targetHorse = null;
    if (!targetUnit) {
      let hb = 400;
      for (const u of S.units) {
        if (u.type !== 'horse' || !S.visible[idx(Math.min(MAP-1,Math.floor(u.x)), Math.min(MAP-1,Math.floor(u.y)))]) continue;
        const [usx, usy] = tileToScreen(u.x, u.y);
        const d = (usx - ex) ** 2 + (usy - ey) ** 2;
        if (d < hb) { hb = d; targetHorse = u; }
      }
    }
    queueCmd({ action: 'order', units: [...S.selected.units], x: tx, y: ty, targetUnit, targetHorse });
    S.fx = { x: px, y: py, age: 0 };
    return;
  }
  // lewy: zaznaczanie
  if (mouse.dragging) {
    // ramka rysowana w px raw, ale porównania w przestrzeni świata (przez ZOOM)
    const x1 = Math.min(mouse.sx, e.offsetX) / ZOOM, x2 = Math.max(mouse.sx, e.offsetX) / ZOOM;
    const y1 = Math.min(mouse.sy, e.offsetY) / ZOOM, y2 = Math.max(mouse.sy, e.offsetY) / ZOOM;
    S.selected.units = S.units.filter(u => {
      if (u.fac !== 'player') return false;
      const [ux, uy] = tileToScreen(u.x, u.y);
      return ux >= x1 && ux <= x2 && uy >= y1 && uy <= y2;
    });
    S.selected.building = null;
    updatePanels();
    return;
  }
  // klik: jednostka?
  let hit = null, bd = 400;
  for (const u of S.units) {
    if (u.fac !== 'player') continue;
    const [ux, uy] = tileToScreen(u.x, u.y);
    const d = (ux - ex) ** 2 + (uy - ey) ** 2;
    if (d < bd) { bd = d; hit = u; }
  }
  if (hit) { S.selected.units = [hit]; S.selected.building = null; updatePanels(); sfx('sel', hit.x, hit.y); return; }
  // klik: budynek?
  const b = inMap(tx, ty) ? buildingAt(tx, ty) : null;
  if (b && b.fac === 'player') { S.selected.building = b; S.selected.units = []; updatePanels(); sfx('sel', b.cx, b.cy); return; }
  S.selected.units = []; S.selected.building = null;
  updatePanels();
});
mini.addEventListener('pointerdown', e => {

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  const k = e.key.toUpperCase();
  ensureAudio();
  if (k === 'C' && !e.repeat) { S.muted = !S.muted; if (!S.muted) ensureAudio(); }
  if (S.placing && e.key === 'Escape') S.placing = null;
  const item = buildMenuFor(S.playerRace).find(m => m.key === k);
  if (item && S.selected.units.some(u => unitRole(u, 'builder'))) S.placing = item.type;
  // zdolności medicine mana: R deszcz, B burza; B nie koliduje, bo fabrykę (B) stawiają tylko Osadnicy, a medicine man jest jednostką Sioux
  if (!e.ctrlKey && !e.altKey && !e.repeat && (k === 'R' || k === 'B')) {
    const m = S.selected.units.find(u => u.fac === 'player' && u.type === 'medicine');
    if (m && k === 'R') castRain(m);
    if (m && k === 'B') castStorm(m);
  }
  // postawy: G/N/O/T dla zaznaczonego wojska (gracza)
  if (!e.ctrlKey && !e.altKey && !e.repeat) {
    const st = STANCE_MENU.find(s => s.key === k);
    if (st && S.selected.units.some(u => u.fac === 'player' && CFG.units[u.type] && CFG.units[u.type].aggro > 0)) setStance(st.id);
  }
  // grupy: Ctrl+1-9 przypisuje, cyfra wybiera, podwójne wciśnięcie centruje kamerę
  if (k >= '1' && k <= '9') {
    const n = k.charCodeAt(0) - 48;
    if (e.ctrlKey) {
      const alive = S.selected.units.filter(u => S.units.includes(u) && u.fac === 'player');
      if (alive.length) { S.groups[n] = alive; uiAlert('Grupa ' + n + ': ' + alive.length + ' jedn.'); e.preventDefault(); }
    } else if (S.groups[n] && S.groups[n].length) {
      const g = S.groups[n].filter(u => S.units.includes(u));
      S.groups[n] = g;
      if (g.length) {
        if (S.lastGroup === n && Date.now() - S.lastGroupT < 350) {
          cam.x = g.reduce((a, u) => a + u.x, 0) / g.length;
          cam.y = g.reduce((a, u) => a + u.y, 0) / g.length;
          clampCam();
        }
        S.selected.units = g; S.selected.building = null; updatePanels(); sfx('sel');
      }
      S.lastGroup = n; S.lastGroupT = Date.now();
    }
  }
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// tryb testowy: deterministyczne rozmieszczenie budowli spiralą wokół obozu
function testPlace(fac, type, cx, cy) {
  const def = CFG.buildings[type];
  for (let r = 3; r <= 14; r++) {
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue; // tylko obwód pierścienia
      const tx = cx + dx - Math.floor(def.w / 2), ty = cy + dy - Math.floor(def.h / 2);
      let ok = true;
      for (let y = ty; y < ty + def.h && ok; y++) for (let x = tx; x < tx + def.w; x++)
        if (!inMap(x, y) || isBlocked(x, y)) { ok = false; break; }
      if (ok) { const b = addBuilding(type, tx, ty, fac); b.built = true; b.progress = 1; return b; }
    }
  }
  return null;
}
function setupTest(race) {
  S.testMode = true;
  S.playerRace = race || 'settler';
  S.units = [];
  S.rainT = {}; S.storms = []; // zdolności nie przeciekają między partiami
  S.buildings = S.buildings.filter(b => b.type === 'hq');
  const phq = S.buildings.find(b => b.fac === 'player');
  const ehq = S.buildings.find(b => b.fac === 'enemy');
  const pBlds = S.playerRace === 'sioux'
    ? ['storehouse', 'farm', 'barracks', 'tepee', 'tepee', 'farm']
    : ['storehouse', 'farm', 'barracks', 'factory', 'zagroda', 'house', 'house', 'farm'];
  for (const t of pBlds)
    testPlace('player', t, Math.floor(phq.cx), Math.floor(phq.cy));
  for (const t of ['storehouse', 'farm', 'barracks', 'factory', 'house', 'house'])
    testPlace('enemy', t, Math.floor(ehq.cx), Math.floor(ehq.cy));
  S.res = S.playerRace === 'sioux' ? { wood: 500, food: 500, gold: 1000, guns: 0, horses: 0 } : { wood: 500, food: 500, gold: 1000, guns: 50, horses: 20 };
  S.resE = { wood: 500, food: 500, gold: 1000, guns: 50, horses: 20 };
  // jednostki dopiero PO zabudowie: spawn na wolnych kaflach wokół obozu
  const ps = freeTilesAround(Math.floor(phq.cx), Math.floor(phq.cy), 5);
  const es = freeTilesAround(Math.floor(ehq.cx), Math.floor(ehq.cy), 5);
  let pi = 0, ei = 0;
  const spawnP = t => { if (pi < ps.length) { const u = addUnit(t, 'player', ps[pi][0], ps[pi][1]); u.x += 0.5; u.y += 0.5; pi++; } };
  const spawnE = t => { if (ei < es.length) { const u = addUnit(t, 'enemy', es[ei][0], es[ei][1]); u.x += 0.5; u.y += 0.5; ei++; } };
  for (let i = 0; i < 6; i++) spawnE('worker');
  if (S.playerRace === 'sioux') {
    for (let i = 0; i < 4; i++) spawnP('squaw');
    for (let i = 0; i < 6; i++) spawnP('wojownik');
    for (let i = 0; i < 6; i++) spawnP('lucznik');
    spawnP('medicine'); spawnP('wodz');
  } else {
    for (let i = 0; i < 6; i++) spawnP('worker');
    for (let i = 0; i < 8; i++) spawnP('piechota');
    for (let i = 0; i < 4; i++) spawnP('jezdiec');
  }
  for (let i = 0; i < 10; i++) spawnE('desperado');
  for (let i = 0; i < 3; i++) spawnE('bandleader');
  for (let i = 0; i < 4; i++) spawnE('konnobanda');
  S.ai = { thinkT: 1, attacks: 0, attackCd: CFG.ai.attackCooldown, trainQ: 0 };
  computeFog();
  centerCameraOn(phq.cx, phq.cy + 4);
  updateTopbar(); updatePanels();
}

  const w = b.w * CFG.tileW / 2, h = b.h * CFG.tileH;
  if (!b.built) {
    // duch budynku: bryła materializuje się wraz z postępem, rusztowanie = przerywana elipsa
    ctx.globalAlpha = 0.15 + 0.5 * b.progress;
    blitSpr(bldSpr(b.type, b.fac), sx, sy);
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#c9a35f'; ctx.lineWidth = 2;
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.ellipse(sx, sy, w, h / 2, 0, 0, 7); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#e8d9b0'; ctx.font = '12px Georgia'; ctx.textAlign = 'center';
    ctx.fillText(Math.floor(b.progress * 100) + '%', sx, sy - h / 4);
    return;
  }
  blitSpr(bldSpr(b.type, b.fac), sx, sy);
  ctx.fillStyle = b.fac === 'enemy' ? '#ff8f6f' : '#f0e2bd';
  ctx.font = '11px Georgia'; ctx.textAlign = 'center';
  ctx.fillText(def.label, sx, sy + b.h * CFG.tileH / 2 - 6);
  if (b.hp < b.maxHp) drawHpBar(sx, sy + b.h * CFG.tileH / 2 + 6, w, b.hp / b.maxHp, b.fac === 'enemy');
  if (b.queue.length) {
    ctx.fillStyle = '#ffd97a'; ctx.font = '11px Georgia';
    ctx.fillText('⏳' + Math.ceil(b.queue[0].remaining) + 's', sx, sy + b.h * CFG.tileH / 2 - 18);
  }
}
// padlina po zwierzynie: ciemna bryła mięsa z jaśniejszym rozłupem i kreską kości
function drawCarcass(sx, sy) {
  ctx.fillStyle = '#6e3a26';
  ctx.beginPath(); ctx.ellipse(sx, sy - 4, 14, 6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#8a4a2e';
  ctx.beginPath(); ctx.ellipse(sx - 2, sy - 5, 9, 3.5, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#d8d0c0'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(sx - 8, sy - 3); ctx.lineTo(sx + 6, sy - 7); ctx.stroke();
}
function drawUnit(u) {
  const [sx, sy] = tileToScreen(u.x, u.y);
  const spr = SPR[(u.fac === 'enemy' && ENEMY_UNIT_SPR[u.type]) || UNIT_SPR[u.type]] || SPR.worker;
  // animacja: bobbing w marszu (jeźdźcy mocniej, wolniej), tremor przy pracy, odrzut po strzale
  let by = 0, kx = 0;
  const mounted = u.type === 'jezdiec' || u.type === 'konnobanda';
  const moving = u.path.length && ['toNode', 'toDeposit', 'toBuild', 'toFarm', 'toCapture', 'flee', 'attack'].includes(u.state);
  if (moving) by = Math.sin(S.time * (mounted ? 7 : 10) + u.id * 1.7) * (mounted ? 2.5 : 1.4);
  else if (u.state === 'gather' || u.state === 'farming' || u.state === 'building') by = Math.sin(S.time * 16 + u.id) * 0.7;
  if (u.kick > 0) kx = u.facing * 2 * (u.kick / 0.15);
  // cień na gruncie: zostaje na ziemi, gdy sylwetka unosi się w bobbingu, i słabnie z uniesieniem
  const lift = Math.max(0, by);
  ctx.fillStyle = 'rgba(0,0,0,' + (0.18 * (1 - Math.min(0.5, lift / 5))).toFixed(3) + ')';
  ctx.beginPath(); ctx.ellipse(sx, sy + 8, 11 - lift * 0.5, 5 - lift * 0.25, 0, 0, 7); ctx.fill();
  blitSpr(spr, sx + kx, sy + 4 + by);
  const topY = sy + 4 + by - spr.ay;
  if (u.carry > 0) {
    ctx.fillStyle = u.carryType === 'wood' ? '#8a6b45' : '#e8c34a';
    ctx.fillRect(sx + 6, sy - 14, 6, 6);
  }
  if (u.hp < u.maxHp) drawHpBar(sx, topY - 2, 18, u.hp / u.maxHp, u.fac === 'enemy');
  if (u.state === 'flee') {
    ctx.fillStyle = '#ff4a4a'; ctx.font = 'bold 13px Georgia'; ctx.textAlign = 'center';
    ctx.fillText('!', sx, topY - 6);
  } else if (u.morale < 60) {
    ctx.fillStyle = '#000'; ctx.fillRect(sx - 10, topY - 8, 20, 4);
    ctx.fillStyle = '#e8c34a'; ctx.fillRect(sx - 9, topY - 7, 18 * Math.max(0, u.morale / 100), 2);
  }
  // doświadczenie: trzecia statystyka oryginału, pasek po drodze do progu + poziom (gwiazdka z cyfrą)
  if (u.xp > 0) {
    const X = CFG.xp;
    const prev = u.lvl > 0 ? X.thresholds[u.lvl - 1] : 0;
    const next = u.lvl < X.thresholds.length ? X.thresholds[u.lvl] : null;
    const frac = next ? (u.xp - prev) / (next - prev) : 1;
    ctx.fillStyle = '#000'; ctx.fillRect(sx - 10, topY - 13, 20, 3);
    ctx.fillStyle = '#5a8fd4'; ctx.fillRect(sx - 9, topY - 12, 18 * Math.max(0, Math.min(1, frac)), 1);
    if (u.lvl > 0) {
      ctx.fillStyle = '#8ab4ea'; ctx.font = '10px Georgia'; ctx.textAlign = 'left';
      ctx.fillText('✦' + u.lvl, sx + 12, topY - 5);
    }
  }
}
function drawHpBar(sx, sy, w, frac, enemy) {
  ctx.fillStyle = '#000'; ctx.fillRect(sx - w / 2 - 1, sy - 1, w + 2, 5);
  ctx.fillStyle = enemy ? '#d14a1e' : '#5fae4a';
  ctx.fillRect(sx - w / 2, sy, w * Math.max(0, frac), 3);
}
function renderMinimap() {
  mctx.fillStyle = '#000'; mctx.fillRect(0, 0, 160, 160);
  const px = 160 / MAP;
  for (let y = 0; y < MAP; y++) for (let x = 0; x < MAP; x++) {
    const i = idx(x, y);
    if (!S.explored[i]) continue;
    const t = S.terrain[i];
    mctx.fillStyle = t === T_FOREST ? '#2c4a1e' : t === T_GOLD ? '#e8c34a' : t === T_WATER ? '#3a6272' : t === T_MEAT ? '#a05a3a' : t === T_THICK ? '#1c3812' : '#8a7634';
    mctx.fillRect(x * px, y * px, px, px);
  }
  for (const b of S.buildings) {
    if (!S.explored[idx(Math.min(MAP - 1, Math.floor(b.cx)), Math.min(MAP - 1, Math.floor(b.cy)))]) continue;
    mctx.fillStyle = b.fac === 'enemy' ? '#ff5f5f' : '#7fd4ff';
    mctx.fillRect(b.tx * px, b.ty * px, b.w * px, b.h * px);
  }
  for (const u of S.units) {
    const ux = Math.min(MAP - 1, Math.floor(u.x)), uy = Math.min(MAP - 1, Math.floor(u.y));
    if ((u.fac === 'enemy' || u.fac === 'neutral') && !S.visible[idx(ux, uy)]) continue;
    mctx.fillStyle = u.fac === 'enemy' ? '#ff8f6f' : u.fac === 'neutral' ? '#c9a35f' : '#fff';
    mctx.fillRect(u.x * px - 1, u.y * px - 1, 2.5, 2.5);
  }
  // prostokąt widoku
  const [wx, wy] = screenToTile(0, 0);
  const [wx2, wy2] = screenToTile(canvasW, canvasH);
  mctx.strokeStyle = '#fff'; mctx.lineWidth = 1;
  mctx.strokeRect(wx * px, wy * px, (wx2 - wx) * px, (wy2 - wy) * px);
}

// ============================== MAIN ==============================
const STEP_MS = 1000 / 60;
const MAX_FRAME_MS = 250;
let prevTime = 0, acc = 0, uiTimer = 0;
function frame(now) {
  acc += Math.min(now - prevTime, MAX_FRAME_MS);
  prevTime = now;
  let stepped = false;
  while (acc >= STEP_MS) { update(STEP_MS / 1000); acc -= STEP_MS; stepped = true; }
  // kamera (cs w px świata: przy zoomie 2x ta sama prędkość na ekranie wymaga 2x większego kroku)
  const cs = 12 * ZOOM;
  if (keys.ArrowLeft || keys.a) cam.x += cs;
  if (keys.ArrowRight || keys.d) cam.x -= cs;
  if (keys.ArrowUp || keys.w) cam.y += cs;
  if (keys.ArrowDown || keys.s) cam.y -= cs;
  if (mouse.x < 24) cam.x += cs; if (mouse.x > canvasW - 24) cam.x -= cs;
  if (mouse.y < 24) cam.y += cs; if (mouse.y > canvasH - 24) cam.y -= cs;
  clampCam();
  render();
  uiTimer += 1;
  if (stepped && uiTimer % 15 === 0) { updateTopbar(); updatePanels(); }
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) prevTime = performance.now(); });

resize();
newGame((Date.now() % 2147483647) >>> 0);
updateTopbar(); updatePanels();
showMenu();
requestAnimationFrame(t => { prevTime = t; requestAnimationFrame(frame); });
</script>
